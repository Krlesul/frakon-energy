name: Cleanup Python Artifacts

on:
  push:
    branches:
      - agent/ha-websocket-admin-compat

permissions:
  contents: write

jobs:
  cleanup:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
        with:
          ref: agent/ha-websocket-admin-compat
          fetch-depth: 0
      - name: Remove generated Python artifacts and add ignore rules
        run: |
          find custom_components tests -type d -name __pycache__ -prune -exec rm -rf {} +
          find custom_components tests -type f \( -name '*.pyc' -o -name '*.pyo' \) -delete
          cat > .gitignore <<'EOF'
          __pycache__/
          *.py[cod]
          .pytest_cache/
          .mypy_cache/
          .ruff_cache/
          node_modules/
          frontend/node_modules/
          EOF
      - name: Commit cleanup
        run: |
          if git diff --quiet -- . ':!.github/workflows/cleanup-python-artifacts.yml' && git status --porcelain | grep -v '.github/workflows/cleanup-python-artifacts.yml' | grep -q .; then
            :
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A custom_components tests .gitignore
          if git diff --cached --quiet; then
            exit 0
          fi
          git commit -m "Remove generated Python bytecode artifacts"
          git push origin HEAD:agent/ha-websocket-admin-compat
