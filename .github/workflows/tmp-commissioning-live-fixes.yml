name: Temporary Commissioning Live Fixes

on:
  push:
    branches:
      - agent/fix-commissioning-live-state

permissions:
  contents: write

jobs:
  fix-build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
        with:
          ref: agent/fix-commissioning-live-state
          fetch-depth: 0
      - uses: actions/setup-node@v5
        with:
          node-version: 24
      - uses: actions/setup-python@v5
        with:
          python-version: '3.13'
      - name: Apply commissioning fixes
        run: |
          python - <<'PY'
          from pathlib import Path

          def replace_once(path: str, old: str, new: str):
              p = Path(path)
              text = p.read_text(encoding='utf-8')
              count = text.count(old)
              if count != 1:
                  raise SystemExit(f'{path}: expected exactly one match, got {count}: {old[:80]!r}')
              p.write_text(text.replace(old, new, 1), encoding='utf-8')

          replace_once(
              'frontend/src/tariff-wizard.tsx',
              '  }, [hass]);\n\n  const supplierGroup',
              '  }, [hass?.connection]);\n\n  const supplierGroup',
          )

          p = Path('frontend/src/home-assistant.ts')
          text = p.read_text(encoding='utf-8')
          text = text.replace(
              '  todayConsumptionKwh: number | null;\n  monthConsumptionKwh: number | null;',
              '  todayConsumptionKwh: number | null;\n  todayCostCzk: number | null;\n  monthConsumptionKwh: number | null;',
              1,
          )
          text = text.replace(
              '  todayConsumptionKwh: null,\n  monthConsumptionKwh: null,',
              '  todayConsumptionKwh: null,\n  todayCostCzk: null,\n  monthConsumptionKwh: null,',
              1,
          )
          marker = 'function parseRawSchedule(raw: unknown): ScheduleItem[] { if (!Array.isArray(raw)) return []; return raw.flatMap((item) => { if (!item || typeof item !== "object") return []; const candidate = item as Record<string, unknown>; const tariff = String(candidate.tariff ?? candidate.rate ?? "").toUpperCase(); const start = String(candidate.start ?? candidate.from ?? ""); const end = String(candidate.end ?? candidate.to ?? ""); if ((tariff !== "NT" && tariff !== "VT") || !start || !end) return []; return [{ start, end, tariff } as ScheduleItem]; }); }\n'
          helper = marker + 'function findStructuredScheduleEntity(hass: HomeAssistant): HassEntity | undefined { return allStates(hass).find((entity) => parseRawSchedule(entity.attributes.schedule).length > 0 || parseRawSchedule(entity.attributes.today_schedule).length > 0 || parseRawSchedule(entity.attributes.dnesni_rozvrh).length > 0); }\n'
          if text.count(marker) != 1:
              raise SystemExit('home-assistant.ts: parseRawSchedule marker mismatch')
          text = text.replace(marker, helper, 1)
          old_sched = 'const scheduleEntity = findByAliases(hass, ["hdo dnesni rozvrh", "frakon energy schedule", "cez hdo dnesni rozvrh", "hdo rozvrh", "cez_hdo_schedule"]); const schedules = splitSchedule(scheduleEntity);'
          new_sched = 'const scheduleEntity = findByAliases(hass, ["hdo dnesni rozvrh", "frakon energy schedule", "cez hdo dnesni rozvrh", "hdo rozvrh", "cez_hdo_schedule"]) ?? findStructuredScheduleEntity(hass); const schedules = splitSchedule(scheduleEntity);'
          if text.count(old_sched) != 1:
              raise SystemExit('home-assistant.ts: schedule lookup marker mismatch')
          text = text.replace(old_sched, new_sched, 1)
          old_return = 'todayConsumptionKwh: numberState(findByAliases(hass, ["spotreba dnes celkem", "today consumption"])), monthConsumptionKwh:'
          new_return = 'todayConsumptionKwh: numberState(findByAliases(hass, ["spotreba dnes celkem", "today consumption"])), todayCostCzk: numberState(findByAliases(hass, ["naklady dnes", "billing today cost", "today cost"])), monthConsumptionKwh:'
          if text.count(old_return) != 1:
              raise SystemExit('home-assistant.ts: dashboard return marker mismatch')
          text = text.replace(old_return, new_return, 1)
          p.write_text(text, encoding='utf-8')

          p = Path('frontend/src/main.tsx')
          text = p.read_text(encoding='utf-8')
          default_line = 'const DEFAULT_NT_SCHEDULE = { weekday: [["02:00", "05:30"], ["13:10", "15:25"], ["21:35", "23:50"]], weekend: [["03:45", "06:55"], ["14:45", "17:30"], ["21:30", "23:35"]] } as const;\n'
          fallback_line = 'function fallbackNtIntervals(date = new Date()): ClockInterval[] { const source = date.getDay() === 0 || date.getDay() === 6 ? DEFAULT_NT_SCHEDULE.weekend : DEFAULT_NT_SCHEDULE.weekday; return source.map(([start, end]) => ({ start, end })); }\n'
          if text.count(default_line) != 1 or text.count(fallback_line) != 1:
              raise SystemExit('main.tsx: legacy HDO fallback markers mismatch')
          text = text.replace(default_line, '', 1).replace(fallback_line, '', 1)
          old_badge = 'function DataBadge({ live }: { live: boolean }) { return <span className={`source-badge ${live ? "live" : "fallback"}`}>{live ? "Živá data HDO" : "Náhradní plán · nepotvrzeno"}</span>; }'
          new_badge = 'function DataBadge({ live, fallbackLabel = "HDO data nejsou dostupná" }: { live: boolean; fallbackLabel?: string }) { return <span className={`source-badge ${live ? "live" : "fallback"}`}>{live ? "Živá data HDO" : fallbackLabel}</span>; }'
          if text.count(old_badge) != 1:
              raise SystemExit('main.tsx: DataBadge marker mismatch')
          text = text.replace(old_badge, new_badge, 1)
          old_intervals = 'const intervals = useMemo(() => today.length > 0 ? today.map((item) => ({ start: new Date(item.start).toLocaleTimeString("cs-CZ", { hour: "2-digit", minute: "2-digit" }), end: new Date(item.end).toLocaleTimeString("cs-CZ", { hour: "2-digit", minute: "2-digit" }) })) : fallbackNtIntervals(now), [today, now.getDay()]);'
          new_intervals = 'const intervals = useMemo(() => today.map((item) => ({ start: new Date(item.start).toLocaleTimeString("cs-CZ", { hour: "2-digit", minute: "2-digit" }), end: new Date(item.end).toLocaleTimeString("cs-CZ", { hour: "2-digit", minute: "2-digit" }) })), [today]); const hasLiveSchedule = intervals.length > 0;'
          if text.count(old_intervals) != 1:
              raise SystemExit('main.tsx: HDO intervals marker mismatch')
          text = text.replace(old_intervals, new_intervals, 1)
          old_head = '<DataBadge live={today.length > 0} />'
          new_head = '<DataBadge live={hasLiveSchedule} fallbackLabel={state.hdoQuality === "live" ? "Živý stav · rozvrh chybí" : "Rozvrh není dostupný"} />'
          if text.count(old_head) != 1:
              raise SystemExit('main.tsx: HDO badge marker mismatch')
          text = text.replace(old_head, new_head, 1)
          old_warn = '{today.length === 0 ? <p className="fallback-warning">Používá se náhradní plán. Časy nejsou potvrzené živými daty distributora.</p> : null}'
          new_warn = '{!hasLiveSchedule ? <p className="fallback-warning">{state.hdoQuality === "live" ? "Živý tarif HDO je dostupný, ale dnešní strukturovaný rozvrh zatím ne. FRAKON proto nezobrazuje náhradní časy." : "HDO rozvrh není dostupný. FRAKON nezobrazuje neověřené náhradní časy."}</p> : null}'
          if text.count(old_warn) != 1:
              raise SystemExit('main.tsx: HDO fallback warning marker mismatch')
          text = text.replace(old_warn, new_warn, 1)
          old_metric = '<Metric label="Náklady dnes" value="—" reason="Chybí ceny a denní historie" />'
          new_metric = '<Metric label="Náklady dnes" value={state.todayCostCzk === null ? "—" : `${formatNumber(state.todayCostCzk, 2)} Kč`} reason={state.todayConsumptionKwh === null ? "Chybí denní historie" : "Chybí potvrzená all-in cena pro dnešní den"} />'
          if text.count(old_metric) != 1:
              raise SystemExit('main.tsx: today cost metric marker mismatch')
          text = text.replace(old_metric, new_metric, 1)
          p.write_text(text, encoding='utf-8')

          p = Path('custom_components/frakon_energy/sensor.py')
          text = p.read_text(encoding='utf-8')
          text = text.replace(
              'from .cost import TariffPrices, calculate_cost_projection\n',
              'from .cost import TariffPrices, calculate_cost_projection\nfrom .daily_all_in_costs import price_confirmed_daily_consumption\n',
              1,
          )
          text = text.replace(
              '    "today_consumption", "month_consumption", "accrued_cost", "current_balance",\n',
              '    "today_consumption", "today_cost", "month_consumption", "accrued_cost", "current_balance",\n',
              1,
          )
          text = text.replace(
              '            "today_consumption": "Spotřeba dnes celkem", "month_consumption": "Spotřeba tento měsíc", "accrued_cost": "Dosavadní náklady",\n',
              '            "today_consumption": "Spotřeba dnes celkem", "today_cost": "Náklady dnes", "month_consumption": "Spotřeba tento měsíc", "accrued_cost": "Dosavadní náklady",\n',
              1,
          )
          text = text.replace(
              '        monetary = {"monthly_advance", "paid_advances", "projected_advances", "accrued_cost", "current_balance", "projected_cost", "projected_balance", "recommended_advance"}\n',
              '        monetary = {"monthly_advance", "paid_advances", "projected_advances", "today_cost", "accrued_cost", "current_balance", "projected_cost", "projected_balance", "recommended_advance"}\n',
              1,
          )
          text = text.replace(
              '            "today_consumption": None,\n            "month_consumption": None,\n',
              '            "today_consumption": None,\n            "today_cost": None,\n            "month_consumption": None,\n',
              1,
          )
          old_today = '''            if today_items:\n                values["today_consumption"] = sum(\n                    (item.high_rate_kwh + item.low_rate_kwh for item in today_items),\n                    Decimal("0"),\n                )\n'''
          new_today = '''            if today_items:\n                values["today_consumption"] = sum(\n                    (item.high_rate_kwh + item.low_rate_kwh for item in today_items),\n                    Decimal("0"),\n                )\n                try:\n                    priced_today = price_confirmed_daily_consumption(options, today_items)\n                    if priced_today:\n                        values["today_cost"] = sum(\n                            (item.variable_cost_czk for item in priced_today),\n                            Decimal("0"),\n                        )\n                except (LookupError, TypeError, ValueError, AttributeError):\n                    pass\n'''
          if text.count(old_today) != 1:
              raise SystemExit('sensor.py: today history marker mismatch')
          text = text.replace(old_today, new_today, 1)
          p.write_text(text, encoding='utf-8')

          p = Path('custom_components/frakon_energy/tariff_http_transport.py')
          text = p.read_text(encoding='utf-8')
          text = text.replace(
              'TARIFF_HTTP_CHUNK_BYTES = 64 * 1024\n',
              'TARIFF_HTTP_CHUNK_BYTES = 64 * 1024\nTARIFF_HTTP_MAX_LINE_SIZE = 64 * 1024\nTARIFF_HTTP_MAX_FIELD_SIZE = 64 * 1024\n',
              1,
          )
          old_get = '''        headers=request_headers,\n        allow_redirects=False,\n        timeout=timeout,\n'''
          new_get = '''        headers=request_headers,\n        allow_redirects=False,\n        timeout=timeout,\n        max_line_size=TARIFF_HTTP_MAX_LINE_SIZE,\n        max_field_size=TARIFF_HTTP_MAX_FIELD_SIZE,\n'''
          if text.count(old_get) != 1:
              raise SystemExit('tariff_http_transport.py: request kwargs marker mismatch')
          text = text.replace(old_get, new_get, 1)
          p.write_text(text, encoding='utf-8')

          p = Path('frontend/src/site-capacity-settings.tsx')
          text = p.read_text(encoding='utf-8')
          old_header = '<div><span className="eyebrow">Kapacita přívodu</span><h2>Rezerva odběru ze sítě</h2></div>'
          new_header = '<div><span className="eyebrow">Pokročilé řízení · volitelné</span><h2>Kapacita přívodu a ochrana řízených startů</h2></div>'
          old_copy = '<p className="settings-copy">Nastavený limit slouží vždy jako diagnostika rezervy přívodu. Blokování řízených startů je samostatná volba. Po zapnutí execution guard vyžaduje čerstvé hlavní měření, započítává rezervace právě startujících spotřebičů a při nedostatečné kapacitě nový start bezpečně odmítne.</p>'
          new_copy = '<p className="settings-copy">Toto nastavení není potřeba pro měření, HDO, tarify ani vyúčtování. Používá se pouze pro bezpečné automatické spouštění řízených spotřebičů. Limit může sloužit jako diagnostika rezervy přívodu; blokování nových startů se zapíná samostatně přes execution guard.</p>'
          if text.count(old_header) != 1 or text.count(old_copy) != 1:
              raise SystemExit('site-capacity-settings.tsx: copy markers mismatch')
          text = text.replace(old_header, new_header, 1).replace(old_copy, new_copy, 1)
          p.write_text(text, encoding='utf-8')

          p = Path('frontend/scripts/check-runtime-live-data-contract.mjs')
          contract = p.read_text(encoding='utf-8')
          marker = 'const spotSettings = read("src/spot-price-settings.tsx");\n'
          guard = '''const tariffWizard = read("src/tariff-wizard.tsx");\nif (tariffWizard.includes("}, [hass]);")) {\n  throw new Error("Tariff wizard must not reset catalog/product on every Home Assistant state object update.");\n}\nif (!tariffWizard.includes("[hass?.connection]")) {\n  throw new Error("Tariff wizard must initialize against the stable Home Assistant connection.");\n}\n\nconst mainUi = read("src/main.tsx");\nfor (const forbidden of ["DEFAULT_NT_SCHEDULE", "fallbackNtIntervals", "Používá se náhradní plán"]) {\n  if (mainUi.includes(forbidden)) {\n    throw new Error(`Production HDO UI must not fabricate fallback intervals: ${forbidden}`);\n  }\n}\nif (!helper.includes("findStructuredScheduleEntity")) {\n  throw new Error("home-assistant.ts must discover structured HDO schedules even when entity names are customized.");\n}\n\n'''
          if guard not in contract:
              if contract.count(marker) != 1:
                  raise SystemExit('runtime contract insertion marker mismatch')
              contract = contract.replace(marker, guard + marker, 1)
          p.write_text(contract, encoding='utf-8')

          p = Path('tests/test_billing_all_in_wiring.py')
          tests = p.read_text(encoding='utf-8')
          addition = '''\n\ndef test_today_cost_uses_confirmed_daily_all_in_pricing_and_stays_unknown_without_authority() -> None:\n    billing = _class(_tree(), "FrakonBillingSensor")\n    values = _function(billing, "_values")\n    source = ast.unparse(values)\n\n    assert "'today_cost': None" in source\n    assert len(_calls(values, "price_confirmed_daily_consumption")) == 1\n    assert "item.variable_cost_czk" in source\n    assert "priced_today" in source\n'''
          if 'test_today_cost_uses_confirmed_daily_all_in_pricing' not in tests:
              tests += addition
          p.write_text(tests, encoding='utf-8')

          p = Path('tests/test_tariff_http_transport.py')
          tests = p.read_text(encoding='utf-8')
          old_expected = '''                "headers": request.headers_dict(),\n                "allow_redirects": False,\n                "timeout": 12.0,\n'''
          new_expected = '''                "headers": request.headers_dict(),\n                "allow_redirects": False,\n                "timeout": 12.0,\n                "max_line_size": transport.TARIFF_HTTP_MAX_LINE_SIZE,\n                "max_field_size": transport.TARIFF_HTTP_MAX_FIELD_SIZE,\n'''
          if tests.count(old_expected) != 1:
              raise SystemExit('test_tariff_http_transport.py: expected kwargs marker mismatch')
          tests = tests.replace(old_expected, new_expected, 1)
          p.write_text(tests, encoding='utf-8')
          PY
      - name: Install frontend dependencies
        working-directory: frontend
        run: npm install
      - name: Run frontend commissioning contract
        working-directory: frontend
        run: node scripts/check-runtime-live-data-contract.mjs
      - name: Type-check and build frontend
        working-directory: frontend
        run: npm run build
      - name: Package dashboard inside integration
        run: |
          rm -rf custom_components/frakon_energy/frontend_app
          mkdir -p custom_components/frakon_energy/frontend_app
          cp -R frontend/dist/. custom_components/frakon_energy/frontend_app/
          test -f custom_components/frakon_energy/frontend_app/index.html
      - name: Run targeted backend tests
        run: |
          python -m pip install -q pytest
          python -m pytest -q tests/test_tariff_http_transport.py tests/test_billing_all_in_wiring.py
      - name: Commit generated fixes
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add frontend/src/tariff-wizard.tsx frontend/src/home-assistant.ts frontend/src/main.tsx frontend/src/site-capacity-settings.tsx frontend/scripts/check-runtime-live-data-contract.mjs custom_components/frakon_energy/sensor.py custom_components/frakon_energy/tariff_http_transport.py tests/test_tariff_http_transport.py tests/test_billing_all_in_wiring.py custom_components/frakon_energy/frontend_app
          git commit -m "Fix commissioning tariff HDO and daily cost state"
          git push origin HEAD:agent/fix-commissioning-live-state
