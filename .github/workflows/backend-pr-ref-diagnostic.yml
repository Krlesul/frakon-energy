name: Backend PR Ref Diagnostic

on:
  push:
    branches:
      - agent/commissioning-data-ui-hardening
    paths:
      - ".github/workflows/backend-pr-ref-diagnostic.yml"

permissions:
  contents: read

jobs:
  head-unique:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
        with:
          ref: agent/commissioning-data-ui-hardening
      - uses: actions/setup-python@v6
        with:
          python-version: "3.13"
      - run: python -m pip install --upgrade pip pytest pypdf==6.14.2
      - name: Head sequence unique
        shell: bash
        run: |
          mapfile -t files < <(grep -oE 'tests/test_[A-Za-z0-9_]+\.py' .github/workflows/backend.yml | awk '!seen[$0]++')
          python -m pytest -q "${files[@]}"

  head-literal:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
        with:
          ref: agent/commissioning-data-ui-hardening
      - uses: actions/setup-python@v6
        with:
          python-version: "3.13"
      - run: python -m pip install --upgrade pip pytest pypdf==6.14.2
      - name: Head sequence literal
        shell: bash
        run: |
          mapfile -t files < <(grep -oE 'tests/test_[A-Za-z0-9_]+\.py' .github/workflows/backend.yml)
          python -m pytest -q "${files[@]}"

  merge-literal:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
        with:
          ref: refs/pull/332/merge
      - uses: actions/setup-python@v6
        with:
          python-version: "3.13"
      - run: python -m pip install --upgrade pip pytest pypdf==6.14.2
      - name: PR merge sequence literal
        shell: bash
        run: |
          mapfile -t files < <(grep -oE 'tests/test_[A-Za-z0-9_]+\.py' .github/workflows/backend.yml)
          python -m pytest -q "${files[@]}"
