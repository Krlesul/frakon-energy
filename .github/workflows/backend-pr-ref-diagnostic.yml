name: Backend PR Ref Diagnostic

on:
  push:
    branches:
      - agent/commissioning-data-ui-hardening
    paths:
      - ".github/workflows/backend-pr-ref-diagnostic.yml"

permissions:
  contents: read

jobs:
  domain-only:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
        with:
          ref: agent/commissioning-data-ui-hardening
      - uses: actions/setup-python@v6
        with:
          python-version: "3.13"
      - run: python -m pip install --upgrade pip pytest pypdf==6.14.2
      - run: python -m pytest -q tests/test_domain.py

  without-domain:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
        with:
          ref: agent/commissioning-data-ui-hardening
      - uses: actions/setup-python@v6
        with:
          python-version: "3.13"
      - run: python -m pip install --upgrade pip pytest pypdf==6.14.2
      - name: Backend sequence without domain
        shell: bash
        run: |
          mapfile -t files < <(grep -oE 'tests/test_[A-Za-z0-9_]+\.py' .github/workflows/backend.yml | awk '!seen[$0]++' | grep -v '^tests/test_domain.py$')
          python -m pytest -q "${files[@]}"
