name: Backend PR Ref Diagnostic

on:
  push:
    branches:
      - agent/commissioning-data-ui-hardening
    paths:
      - ".github/workflows/backend-pr-ref-diagnostic.yml"

permissions:
  contents: write

jobs:
  capture:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
        with:
          ref: agent/commissioning-data-ui-hardening
      - uses: actions/setup-python@v6
        with:
          python-version: "3.13"
      - run: python -m pip install --upgrade pip pytest pypdf==6.14.2
      - name: Run backend sequence and capture result
        shell: bash
        run: |
          mapfile -t files < <(grep -oE 'tests/test_[A-Za-z0-9_]+\.py' .github/workflows/backend.yml | awk '!seen[$0]++')
          set +e
          python -m pytest -q "${files[@]}" > backend-failure.txt 2>&1
          status=$?
          set -e
          if [[ $status -eq 0 ]]; then
            echo "ALL TESTS PASSED" > backend-failure.txt
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add backend-failure.txt
          git commit -m "Capture backend diagnostic output"
          git push origin HEAD:agent/commissioning-data-ui-hardening
          exit $status
