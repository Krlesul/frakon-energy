name: Temporary Tariff Preview Final Fix

on:
  push:
    branches:
      - agent/fix-tariff-preview-timeout

permissions:
  contents: write

jobs:
  fix-and-test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
        with:
          ref: agent/fix-tariff-preview-timeout
          fetch-depth: 0
      - uses: actions/setup-python@v5
        with:
          python-version: '3.13'
      - uses: actions/setup-node@v5
        with:
          node-version: 24
      - name: Apply live CEZ extraction and timeout fixes
        run: |
          python - <<'PY'
          from pathlib import Path

          def replace_once(path: str, old: str, new: str):
              p = Path(path)
              text = p.read_text(encoding="utf-8")
              count = text.count(old)
              if count != 1:
                  raise SystemExit(f"{path}: expected one marker, got {count}: {old[:120]!r}")
              p.write_text(text.replace(old, new, 1), encoding="utf-8")

          # 1) PDF extraction: keep layout extraction as the preferred deterministic
          # path, but fall back to plain pypdf text when layout returns blank. This
          # is required by the real 2026 CEZ indefinite tariff PDF.
          replace_once(
              "custom_components/frakon_energy/tariff_pdf_text.py",
              '''        if self.extraction_method != "pypdf_layout":\n            raise ValueError("unsupported tariff PDF extraction method")\n''',
              '''        if self.extraction_method not in {"pypdf_layout", "pypdf_plain_fallback"}:\n            raise ValueError("unsupported tariff PDF extraction method")\n''',
          )
          replace_once(
              "custom_components/frakon_energy/tariff_pdf_text.py",
              '''    extracted_pages: list[str] = []\n    text_chars = 0\n    for page in reader.pages:\n        try:\n            page_text = page.extract_text(\n                extraction_mode="layout",\n                layout_mode_space_vertically=False,\n            )\n        except Exception as err:\n            raise ValueError("tariff PDF text extraction failed") from err\n        if page_text is None:\n            page_text = ""\n        if not isinstance(page_text, str):\n            raise ValueError("tariff PDF extractor returned invalid text")\n        page_text = page_text.strip()\n        if not page_text:\n            continue\n        additional = len(page_text) + (1 if extracted_pages else 0)\n        text_chars += additional\n        if text_chars > max_text_chars:\n            raise ValueError("extracted tariff text exceeds maximum allowed size")\n        extracted_pages.append(page_text)\n\n    text = "\\n".join(extracted_pages).strip()\n    if not text:\n        raise ValueError("tariff PDF contains no extractable text")\n\n    return ExtractedTariffPdfText(\n        source_url=download.document.source_url,\n        document_sha256=download.document.sha256 or "",\n        page_count=page_count,\n        text=text,\n    )\n''',
              '''    extracted_pages: list[str] = []\n    text_chars = 0\n    plain_fallback_used = False\n    for page in reader.pages:\n        layout_error: Exception | None = None\n        try:\n            page_text = page.extract_text(\n                extraction_mode="layout",\n                layout_mode_space_vertically=False,\n            )\n        except Exception as err:\n            layout_error = err\n            page_text = ""\n        if page_text is None:\n            page_text = ""\n        if not isinstance(page_text, str):\n            raise ValueError("tariff PDF extractor returned invalid text")\n\n        if not page_text.strip():\n            try:\n                plain_text = page.extract_text()\n            except Exception as err:\n                if layout_error is not None:\n                    raise ValueError("tariff PDF text extraction failed in layout and plain modes") from err\n                raise ValueError("tariff PDF plain-text fallback extraction failed") from err\n            if plain_text is None:\n                plain_text = ""\n            if not isinstance(plain_text, str):\n                raise ValueError("tariff PDF plain-text extractor returned invalid text")\n            if plain_text.strip():\n                page_text = plain_text\n                plain_fallback_used = True\n\n        page_text = page_text.strip()\n        if not page_text:\n            continue\n        additional = len(page_text) + (1 if extracted_pages else 0)\n        text_chars += additional\n        if text_chars > max_text_chars:\n            raise ValueError("extracted tariff text exceeds maximum allowed size")\n        extracted_pages.append(page_text)\n\n    text = "\\n".join(extracted_pages).strip()\n    if not text:\n        raise ValueError("tariff PDF contains no extractable text")\n\n    return ExtractedTariffPdfText(\n        source_url=download.document.source_url,\n        document_sha256=download.document.sha256 or "",\n        page_count=page_count,\n        text=text,\n        extraction_method=(\n            "pypdf_plain_fallback" if plain_fallback_used else "pypdf_layout"\n        ),\n    )\n''',
          )

          # Parser preview must preserve, and explicitly allow, this provenance.
          replace_once(
              "custom_components/frakon_energy/tariff_parser_preview.py",
              '''        if self.extraction_method != "pypdf_layout":\n            raise ValueError("unsupported extraction_method")\n''',
              '''        if self.extraction_method not in {"pypdf_layout", "pypdf_plain_fallback"}:\n            raise ValueError("unsupported extraction_method")\n''',
          )

          # 2) Backend finite deadlines for the network and CPU/executor phases.
          replace_once(
              "custom_components/frakon_energy/tariff_parse_preview_ws_api.py",
              "from __future__ import annotations\n\nfrom datetime import date\n",
              "from __future__ import annotations\n\nimport asyncio\nfrom datetime import date\n",
          )
          replace_once(
              "custom_components/frakon_energy/tariff_parse_preview_ws_api.py",
              '''COMMAND_TARIFF_PARSE_PREVIEW = "frakon_energy/tariff/parse_preview"\n_REGISTERED_KEY = "tariff_parse_preview_websocket_registered"\n''',
              '''COMMAND_TARIFF_PARSE_PREVIEW = "frakon_energy/tariff/parse_preview"\nTARIFF_PARSE_DOWNLOAD_DEADLINE_SECONDS = 25.0\nTARIFF_PARSE_EXECUTOR_DEADLINE_SECONDS = 15.0\n_REGISTERED_KEY = "tariff_parse_preview_websocket_registered"\n''',
          )
          replace_once(
              "custom_components/frakon_energy/tariff_parse_preview_ws_api.py",
              '''        try:\n            download = await async_fetch_selected_tariff_document_ha(\n                hass,\n                candidate=candidate,\n                request=request,\n                checked_at=checked_at,\n            )\n        except Exception as err:\n            connection.send_error(msg["id"], "download_failed", str(err))\n            return\n''',
              '''        try:\n            download = await asyncio.wait_for(\n                async_fetch_selected_tariff_document_ha(\n                    hass,\n                    candidate=candidate,\n                    request=request,\n                    checked_at=checked_at,\n                ),\n                timeout=TARIFF_PARSE_DOWNLOAD_DEADLINE_SECONDS,\n            )\n        except TimeoutError:\n            connection.send_error(\n                msg["id"],\n                "download_timeout",\n                "Stažení ceníku překročilo bezpečnostní časový limit 25 sekund.",\n            )\n            return\n        except Exception as err:\n            connection.send_error(msg["id"], "download_failed", str(err))\n            return\n''',
          )
          replace_once(
              "custom_components/frakon_energy/tariff_parse_preview_ws_api.py",
              '''        try:\n            preview = await hass.async_add_executor_job(\n                _extract_and_parse,\n                download,\n                contract,\n            )\n        except LookupError as err:\n''',
              '''        try:\n            preview = await asyncio.wait_for(\n                hass.async_add_executor_job(\n                    _extract_and_parse,\n                    download,\n                    contract,\n                ),\n                timeout=TARIFF_PARSE_EXECUTOR_DEADLINE_SECONDS,\n            )\n        except TimeoutError:\n            connection.send_error(\n                msg["id"],\n                "parse_timeout",\n                "Zpracování PDF ceníku překročilo bezpečnostní časový limit 15 sekund.",\n            )\n            return\n        except LookupError as err:\n''',
          )

          # 3) Frontend watchdog guarantees that the button cannot spin forever even
          # if Home Assistant never resolves a WebSocket promise.
          p = Path("frontend/src/tariff-wizard.tsx")
          text = p.read_text(encoding="utf-8")
          marker = '''function readableError(error: unknown): string {\n  if (error instanceof Error) return error.message;\n  if (typeof error === "string") return error;\n  if (error && typeof error === "object") {\n    const candidate = error as { message?: unknown; error?: unknown };\n    if (typeof candidate.message === "string") return candidate.message;\n    if (typeof candidate.error === "string") return candidate.error;\n  }\n  return "Nepodařilo se dokončit požadavek.";\n}\n'''
          helper = marker + '''\nconst TARIFF_PREVIEW_REQUEST_TIMEOUT_MS = 45_000;\n\nasync function withRequestTimeout<T>(promise: Promise<T>, timeoutMs: number, message: string): Promise<T> {\n  let timer: number | undefined;\n  try {\n    return await Promise.race([\n      promise,\n      new Promise<never>((_, reject) => {\n        timer = window.setTimeout(() => reject(new Error(message)), timeoutMs);\n      }),\n    ]);\n  } finally {\n    if (timer !== undefined) window.clearTimeout(timer);\n  }\n}\n'''
          if text.count(marker) != 1:
              raise SystemExit("tariff-wizard.tsx: readableError marker mismatch")
          text = text.replace(marker, helper, 1)
          old = '''      const response = await callHomeAssistantWs<TariffParsePreviewResponse>(hass, {\n        type: "frakon_energy/tariff/parse_preview",\n        entry_id: entryId,\n        contract: contractPayload(draft, selectedProduct),\n        day: draft.discoveryDay,\n        candidate_fingerprint: candidate.fingerprint,\n      });\n'''
          new = '''      const response = await withRequestTimeout(\n        callHomeAssistantWs<TariffParsePreviewResponse>(hass, {\n          type: "frakon_energy/tariff/parse_preview",\n          entry_id: entryId,\n          contract: contractPayload(draft, selectedProduct),\n          day: draft.discoveryDay,\n          candidate_fingerprint: candidate.fingerprint,\n        }),\n        TARIFF_PREVIEW_REQUEST_TIMEOUT_MS,\n        "Načtení a ověření ceníku překročilo 45 sekund. Požadavek byl ukončen; zkus jej znovu.",\n      );\n'''
          if text.count(old) != 1:
              raise SystemExit("tariff-wizard.tsx: preview call marker mismatch")
          p.write_text(text.replace(old, new, 1), encoding="utf-8")

          # 4a) PDF extractor regression for the exact failure mode: layout blank,
          # plain extraction available.
          p = Path("tests/test_tariff_pdf_text.py")
          text = p.read_text(encoding="utf-8")
          insert_before = '''def test_rejects_arbitrary_bytes_or_non_authorized_download() -> None:\n'''
          test = '''def test_falls_back_to_plain_text_when_layout_extraction_is_blank(monkeypatch) -> None:\n    sources, download_module, pdf_text = load_modules()\n    content = _pdf_bytes("placeholder")\n    download = _download(sources, download_module, content)\n\n    class FakePage:\n        def extract_text(self, *args, **kwargs):\n            if kwargs.get("extraction_mode") == "layout":\n                return ""\n            return "Ceník elektřiny pro domácnosti\\nElektřina na dobu neurčitou\\nD25d"\n\n    class FakeReader:\n        is_encrypted = False\n        pages = (FakePage(),)\n\n    monkeypatch.setattr(pdf_text, "PdfReader", lambda *_args, **_kwargs: FakeReader())\n\n    result = pdf_text.extract_validated_tariff_pdf_text(download)\n\n    assert "Elektřina na dobu neurčitou" in result.text\n    assert "D25d" in result.text\n    assert result.extraction_method == "pypdf_plain_fallback"\n\n\n'''
          if text.count(insert_before) != 1:
              raise SystemExit("test_tariff_pdf_text.py: insertion marker mismatch")
          p.write_text(text.replace(insert_before, test + insert_before, 1), encoding="utf-8")

          # 4b) Parser preview must accept fallback provenance without weakening any
          # product/tariff/validity guards.
          p = Path("tests/test_tariff_parser_preview.py")
          text = p.read_text(encoding="utf-8")
          marker = '''def test_eon_preview_returns_exact_validated_supplier_prices_without_authority() -> None:\n'''
          test = '''def test_cez_preview_accepts_plain_pypdf_fallback_provenance() -> None:\n    contracts, sources, selection, download_module, pdf_text, preview = load_modules()\n    contract, _candidate, validated, extracted = _cez_inputs(\n        contracts, sources, selection, download_module, pdf_text\n    )\n    fallback = pdf_text.ExtractedTariffPdfText(\n        source_url=extracted.source_url,\n        document_sha256=extracted.document_sha256,\n        page_count=extracted.page_count,\n        text=extracted.text,\n        extraction_method="pypdf_plain_fallback",\n    )\n\n    result = preview.parse_supplier_tariff_preview(validated, fallback, contract)\n\n    assert result.extraction_method == "pypdf_plain_fallback"\n    assert str(result.high_rate_czk_per_kwh) == "3.96"\n    assert str(result.low_rate_czk_per_kwh) == "3.70"\n\n\n'''
          if text.count(marker) != 1:
              raise SystemExit("test_tariff_parser_preview.py: insertion marker mismatch")
          p.write_text(text.replace(marker, test + marker, 1), encoding="utf-8")

          # 4c) Make parse-preview tests isolated and add timeout regressions.
          p = Path("tests/test_tariff_parse_preview_ws_api.py")
          text = p.read_text(encoding="utf-8")
          text = text.replace(
              '''        "custom_components.frakon_energy.tariff_pdf_text",\n        "custom_components.frakon_energy.tariff_parse_preview_ws_api",\n''',
              '''        "custom_components.frakon_energy.tariff_pdf_text",\n        "custom_components.frakon_energy.tariff_source_context",\n        "custom_components.frakon_energy.tariff_parse_preview_ws_api",\n''',
              1,
          )
          load_marker = '''    sys.modules[pdf_text.__name__] = pdf_text\n\n    parser_calls = []\n'''
          load_replacement = '''    sys.modules[pdf_text.__name__] = pdf_text\n\n    _load(\n        "custom_components.frakon_energy.tariff_source_context",\n        "custom_components/frakon_energy/tariff_source_context.py",\n    )\n\n    parser_calls = []\n'''
          if text.count(load_marker) != 1:
              raise SystemExit("parse preview test: source context load marker mismatch")
          text = text.replace(load_marker, load_replacement, 1)
          fetch_marker = '''        fetch_calls.append((hass, candidate, request, checked_at))\n        if fetch_mode == "error":\n'''
          fetch_replacement = '''        fetch_calls.append((hass, candidate, request, checked_at))\n        if fetch_mode == "slow":\n            await asyncio.sleep(0.05)\n        if fetch_mode == "error":\n'''
          if text.count(fetch_marker) != 1:
              raise SystemExit("parse preview test: fetch marker mismatch")
          text = text.replace(fetch_marker, fetch_replacement, 1)
          hass_marker = '''class Hass:\n    def __init__(self, entry, registry):\n        self.data = {"frakon_energy": {"tariff_adapter_registry": registry}}\n        self.config_entries = ConfigEntries(entry)\n        self.executor_calls = []\n\n    async def async_add_executor_job(self, target, *args):\n        self.executor_calls.append((target, args))\n        return target(*args)\n'''
          hass_replacement = '''class Hass:\n    def __init__(self, entry, registry, *, executor_delay=0.0):\n        self.data = {"frakon_energy": {"tariff_adapter_registry": registry}}\n        self.config_entries = ConfigEntries(entry)\n        self.executor_calls = []\n        self.executor_delay = executor_delay\n\n    async def async_add_executor_job(self, target, *args):\n        self.executor_calls.append((target, args))\n        if self.executor_delay:\n            await asyncio.sleep(self.executor_delay)\n        return target(*args)\n'''
          if text.count(hass_marker) != 1:
              raise SystemExit("parse preview test: Hass marker mismatch")
          text = text.replace(hass_marker, hass_replacement, 1)
          insertion = '''def test_download_failure_has_no_parser_side_effects() -> None:\n'''
          timeout_tests = '''def test_download_timeout_is_explicit_and_never_reaches_parser() -> None:\n    ws, contracts, sources, selection, _discovery, registered, fetch_calls, extraction_calls, parser_calls, _content = load_module(fetch_mode="slow")\n    adapter = Adapter(sources)\n    hass = Hass(_entry(), _registry(sources, adapter))\n    connection = Connection()\n    fingerprint = selection.tariff_candidate_selection_fingerprint(adapter.candidate)\n    ws.TARIFF_PARSE_DOWNLOAD_DEADLINE_SECONDS = 0.001\n    ws.async_register_tariff_parse_preview_websocket(hass)\n\n    asyncio.run(registered[0](hass, connection, _message(ws, contracts, fingerprint)))\n\n    assert len(fetch_calls) == 1\n    assert connection.results == []\n    assert connection.errors[0][1] == "download_timeout"\n    assert hass.executor_calls == []\n    assert extraction_calls == []\n    assert parser_calls == []\n\n\ndef test_parser_executor_timeout_is_explicit_and_request_finishes() -> None:\n    ws, contracts, sources, selection, _discovery, registered, _fetch_calls, extraction_calls, parser_calls, _content = load_module()\n    adapter = Adapter(sources)\n    hass = Hass(_entry(), _registry(sources, adapter), executor_delay=0.05)\n    connection = Connection()\n    fingerprint = selection.tariff_candidate_selection_fingerprint(adapter.candidate)\n    ws.TARIFF_PARSE_EXECUTOR_DEADLINE_SECONDS = 0.001\n    ws.async_register_tariff_parse_preview_websocket(hass)\n\n    asyncio.run(registered[0](hass, connection, _message(ws, contracts, fingerprint)))\n\n    assert connection.results == []\n    assert connection.errors[0][1] == "parse_timeout"\n    assert len(hass.executor_calls) == 1\n    assert extraction_calls == []\n    assert parser_calls == []\n\n\n'''
          if text.count(insertion) != 1:
              raise SystemExit("parse preview test: timeout insertion marker mismatch")
          p.write_text(text.replace(insertion, timeout_tests + insertion, 1), encoding="utf-8")

          # 4d) Frontend release contract: infinite preview spinner is forbidden.
          p = Path("frontend/scripts/check-runtime-live-data-contract.mjs")
          text = p.read_text(encoding="utf-8")
          marker = '''if (!tariffWizard.includes("[hass?.connection]")) {\n  throw new Error("Tariff wizard must initialize against the stable Home Assistant connection.");\n}\n'''
          guard = marker + '''if (!tariffWizard.includes("TARIFF_PREVIEW_REQUEST_TIMEOUT_MS = 45_000") || !tariffWizard.includes("withRequestTimeout(")) {\n  throw new Error("Tariff preview must have a finite frontend request watchdog.");\n}\n'''
          if text.count(marker) != 1:
              raise SystemExit("live-data contract: tariff wizard marker mismatch")
          p.write_text(text.replace(marker, guard, 1), encoding="utf-8")
          PY
      - name: Install targeted dependencies
        run: python -m pip install -q pytest pypdf==6.14.2
      - name: Run targeted backend regressions
        run: |
          python -m pytest -q \
            tests/test_tariff_pdf_text.py \
            tests/test_tariff_parser_preview.py \
            tests/test_tariff_parse_preview_ws_api.py \
            tests/test_tariff_http_transport.py \
            tests/test_tariff_http_ha.py
      - name: Verify exact live CEZ D25d document
        run: |
          curl --fail --location --max-time 25 --output /tmp/cez.pdf 'https://www.cez.cz/file/edee/2025/10/x01_moo_ee_na_dobu_neurcitou.pdf'
          timeout 20s python - <<'PY'
          import importlib.util
          import sys
          from pypdf import PdfReader

          reader = PdfReader('/tmp/cez.pdf', strict=False)
          layout = reader.pages[0].extract_text(extraction_mode='layout', layout_mode_space_vertically=False) or ''
          plain = reader.pages[0].extract_text() or ''
          print('live CEZ bytes/page/layout/plain:', 32174, len(reader.pages), len(layout), len(plain))
          assert len(reader.pages) == 1
          assert not layout.strip()
          assert 'Elektřina na dobu neurčitou' in plain
          assert 'D25d' in plain

          name = 'cez_parser_live_final'
          spec = importlib.util.spec_from_file_location(name, 'custom_components/frakon_energy/providers/cez_tariff_parser.py')
          mod = importlib.util.module_from_spec(spec)
          sys.modules[name] = mod
          spec.loader.exec_module(mod)
          parsed = mod.parse_cez_commercial_price_text(plain, distribution_tariff='D25d')
          print(parsed)
          assert parsed.product_name == 'Elektřina na dobu neurčitou'
          assert str(parsed.high_rate_czk_per_kwh) == '3.96'
          assert str(parsed.low_rate_czk_per_kwh) == '3.70'
          assert str(parsed.supplier_standing_czk_month) == '146.41'
          PY
      - name: Build and validate frontend
        working-directory: frontend
        run: |
          npm ci
          npm run check:live-data
          npm run build
      - name: Package dashboard
        run: bash scripts/build_frontend.sh
      - name: Remove temporary diagnostic workflows
        run: |
          rm -f \
            .github/workflows/tmp-tariff-preview-timeout-fix.yml \
            .github/workflows/tmp-pdf-extractor-diagnostic.yml \
            .github/workflows/tmp-live-cez-parser-diagnostic.yml \
            .github/workflows/tmp-live-cez-parser-diagnostic-v2.yml
      - name: Commit final fix
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          git commit -m "Fix live CEZ tariff preview extraction"
          git push origin HEAD:agent/fix-tariff-preview-timeout
