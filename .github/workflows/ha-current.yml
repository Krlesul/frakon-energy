name: Home Assistant Current

on:
  pull_request:
    paths:
      - ".github/workflows/ha-current.yml"
      - "custom_components/frakon_energy/**"
      - "tests/test_panel_registration.py"
      - "tests/test_cez_hdo.py"
  push:
    branches:
      - main
    paths:
      - ".github/workflows/ha-current.yml"
      - "custom_components/frakon_energy/**"
      - "tests/test_panel_registration.py"
      - "tests/test_cez_hdo.py"

permissions:
  contents: read

jobs:
  validate:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v5

      - name: Setup Python
        uses: actions/setup-python@v6
        with:
          python-version: "3.14.2"

      - name: Install current Home Assistant test environment
        run: >-
          python -m pip install --upgrade pip
          pytest pytest-asyncio
          "homeassistant==2026.8.0"
          "pypdf==6.14.2"

      - name: Import and compile integration
        run: |
          python -m compileall -q custom_components/frakon_energy
          python - <<'PY'
          import custom_components.frakon_energy
          print("FRAKON Energy import OK on Home Assistant 2026.8.0")
          PY

      - name: Run current-HA bootstrap regressions
        run: >-
          python -m pytest -q
          tests/test_panel_registration.py
          tests/test_cez_hdo.py
