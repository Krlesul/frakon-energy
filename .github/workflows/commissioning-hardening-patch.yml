name: Commissioning Hardening Patch

on:
  push:
    branches:
      - agent/commissioning-data-ui-hardening
    paths:
      - ".github/workflows/commissioning-hardening-patch.yml"

permissions:
  contents: write

jobs:
  patch:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v5
        with:
          ref: agent/commissioning-data-ui-hardening

      - name: Apply UI state fixes
        shell: bash
        run: |
          python - <<'PY'
          from pathlib import Path

          def replace(path: str, old: str, new: str, *, count: int = 1) -> None:
              file = Path(path)
              text = file.read_text(encoding="utf-8")
              found = text.count(old)
              if found != count:
                  raise SystemExit(f"{path}: expected {count} match(es), found {found}: {old[:100]!r}")
              file.write_text(text.replace(old, new), encoding="utf-8")

          # Dashboard must distinguish incomplete setup from a completed but expired billing cycle.
          main = "frontend/src/main.tsx"
          replace(
              main,
              'missingReason(state.accruedCostCzk, "Chybí ceny VT/NT nebo počáteční stav")',
              'missingReason(state.accruedCostCzk, "Chybí potvrzená cena pro zúčtovací období")',
          )
          replace(
              main,
              '''function BillingView() { const state = useFrakonEnergyState(); return <section className="page-grid"><BillingSummary /><article className="chart-card"><span className="eyebrow">Zúčtovací období</span><h2>{state.settlementDate ? `Do ${new Date(state.settlementDate).toLocaleDateString("cs-CZ")}` : "Není kompletně nastaveno"}</h2><div className="setup-checklist">{state.missingSetup.length === 0 ? <p>Vyúčtování je připravené.</p> : state.missingSetup.map((item) => <div key={item}><span>!</span><b>{item}</b><small>Vyplňte v nastavení FRAKON Energy.</small></div>)}</div></article></section>; }''',
              '''function BillingView() { const state = useFrakonEnergyState(); const dateLabel = state.settlementDate ? new Date(state.settlementDate).toLocaleDateString("cs-CZ") : null; return <section className="page-grid"><BillingSummary /><article className="chart-card"><span className="eyebrow">Zúčtovací období</span><h2>{state.billingExpired && dateLabel ? `Období skončilo ${dateLabel}` : dateLabel ? `Do ${dateLabel}` : "Není kompletně nastaveno"}</h2><div className="setup-checklist">{state.billingExpired ? <div><span>!</span><b>Vyúčtovací období je ukončené</b><small>Založte nové období podle posledního vyúčtování a aktuálního elektroměru.</small></div> : state.missingSetup.length === 0 ? <p>Vyúčtování je připravené.</p> : state.missingSetup.map((item) => <div key={item}><span>!</span><b>{item}</b><small>Vyplňte v nastavení FRAKON Energy.</small></div>)}</div></article></section>; }''',
          )
          replace(
              main,
              '<div><span>Billing</span><b>{state.missingSetup.length === 0 ? "Připraven" : "Nedokončen"}</b></div>',
              '<div><span>Billing</span><b>{state.billingExpired ? "Nové období" : state.missingSetup.length === 0 ? "Připraven" : "Nedokončen"}</b></div>',
          )
          replace(
              main,
              'Pro výpočet nákladů a predikce doplňte počáteční stavy elektroměru a měsíční zálohu.',
              '{state.billingExpired ? "Poslední zúčtovací období už skončilo. Založte nové období podle posledního vyúčtování." : "Pro výpočet nákladů a predikce doplňte počáteční stavy elektroměru a měsíční zálohu."}',
          )
          # The previous replacement sits inside JSX text; convert the accidental text braces to JSX expression.
          replace(
              main,
              '<p className="settings-copy">{state.billingExpired ? "Poslední zúčtovací období už skončilo. Založte nové období podle posledního vyúčtování." : "Pro výpočet nákladů a predikce doplňte počáteční stavy elektroměru a měsíční zálohu."}</p>',
              '<p className="settings-copy">{state.billingExpired ? "Poslední zúčtovací období už skončilo. Založte nové období podle posledního vyúčtování." : "Pro výpočet nákladů a predikce doplňte počáteční stavy elektroměru a měsíční zálohu."}</p>',
          )

          # Normalize WebSocket rejection objects so cards show the backend reason instead of [object Object].
          home = "frontend/src/home-assistant.ts"
          replace(
              home,
              '''export async function callHomeAssistantWs<T>(hass: HomeAssistant, message: Record<string, unknown>): Promise<T> { if (hass.callWS) return hass.callWS<T>(message); if (hass.connection?.sendMessagePromise) return hass.connection.sendMessagePromise<T>(message); throw new Error("WebSocket Home Assistantu není dostupný."); }''',
              '''export async function callHomeAssistantWs<T>(hass: HomeAssistant, message: Record<string, unknown>): Promise<T> { try { if (hass.callWS) return await hass.callWS<T>(message); if (hass.connection?.sendMessagePromise) return await hass.connection.sendMessagePromise<T>(message); throw new Error("WebSocket Home Assistantu není dostupný."); } catch (reason) { if (reason instanceof Error) throw reason; if (typeof reason === "object" && reason !== null && "message" in reason) throw new Error(String((reason as { message?: unknown }).message ?? "Neznámá chyba Home Assistantu.")); throw new Error(String(reason)); } }''',
          )
          PY

      - name: Commit UI state fixes
        shell: bash
        run: |
          if git diff --quiet; then
            echo "No patch changes"
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add frontend/src/main.tsx frontend/src/home-assistant.ts
          git commit -m "Expose expired billing state and websocket errors"
          git push origin HEAD:agent/commissioning-data-ui-hardening
