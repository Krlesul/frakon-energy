name: Temporary HDO frontend sync

on:
  pull_request:
    paths:
      - "frontend/**"
      - "custom_components/frakon_energy/frontend_app/**"
      - ".github/workflows/temp-hdo-frontend-sync.yml"

permissions:
  contents: write

jobs:
  sync:
    if: github.event.pull_request.head.repo.full_name == github.repository
    runs-on: ubuntu-latest
    steps:
      - name: Checkout PR head
        uses: actions/checkout@v5
        with:
          ref: ${{ github.event.pull_request.head.ref }}

      - name: Setup Node.js
        uses: actions/setup-node@v5
        with:
          node-version: 24

      - name: Install dependencies
        working-directory: frontend
        run: npm install

      - name: Build frontend
        working-directory: frontend
        run: npm run build

      - name: Package dashboard
        run: |
          rm -rf custom_components/frakon_energy/frontend_app
          mkdir -p custom_components/frakon_energy/frontend_app
          cp -R frontend/dist/. custom_components/frakon_energy/frontend_app/

      - name: Commit generated dashboard
        run: |
          if git diff --quiet -- custom_components/frakon_energy/frontend_app; then
            echo "Dashboard bundle already current."
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add custom_components/frakon_energy/frontend_app
          git commit -m "build: sync HDO schedule frontend"
          git push origin HEAD:${{ github.event.pull_request.head.ref }}
