name: WS Admin Compat Patch

on:
  push:
    branches:
      - agent/ha-websocket-admin-compat

permissions:
  contents: write

jobs:
  patch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: agent/ha-websocket-admin-compat
          fetch-depth: 0
      - name: Add regression gate to backend suite
        run: |
          gate='          tests/test_websocket_admin_compat.py'
          grep -qxF "$gate" .github/workflows/backend.yml || printf '%s\n' "$gate" >> .github/workflows/backend.yml
      - name: Commit backend gate
        run: |
          if git diff --quiet; then
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add .github/workflows/backend.yml
          git commit -m "Run websocket admin compatibility test in backend CI"
          git push origin HEAD:agent/ha-websocket-admin-compat
