name: Backend Commissioning Diagnostic

on:
  push:
    branches:
      - agent/commissioning-data-ui-hardening
    paths:
      - ".github/workflows/backend-commissioning-diagnostic.yml"

permissions:
  contents: read

jobs:
  diagnose:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
        with:
          ref: agent/commissioning-data-ui-hardening
      - uses: actions/setup-python@v6
        with:
          python-version: "3.13"
      - run: python -m pip install --upgrade pip pytest pypdf==6.14.2
      - name: Sequence quarter 1
        continue-on-error: true
        shell: bash
        run: |
          mapfile -t files < <(grep -oE 'tests/test_[A-Za-z0-9_]+\.py' .github/workflows/backend.yml | awk '!seen[$0]++')
          n=${#files[@]}; q=$(( (n + 3) / 4 ));
          python -m pytest -q "${files[@]:0:q}"
      - name: Sequence quarter 2
        continue-on-error: true
        shell: bash
        run: |
          mapfile -t files < <(grep -oE 'tests/test_[A-Za-z0-9_]+\.py' .github/workflows/backend.yml | awk '!seen[$0]++')
          n=${#files[@]}; q=$(( (n + 3) / 4 ));
          python -m pytest -q "${files[@]:q:q}"
      - name: Sequence quarter 3
        continue-on-error: true
        shell: bash
        run: |
          mapfile -t files < <(grep -oE 'tests/test_[A-Za-z0-9_]+\.py' .github/workflows/backend.yml | awk '!seen[$0]++')
          n=${#files[@]}; q=$(( (n + 3) / 4 ));
          python -m pytest -q "${files[@]:q*2:q}"
      - name: Sequence quarter 4
        continue-on-error: true
        shell: bash
        run: |
          mapfile -t files < <(grep -oE 'tests/test_[A-Za-z0-9_]+\.py' .github/workflows/backend.yml | awk '!seen[$0]++')
          n=${#files[@]}; q=$(( (n + 3) / 4 ));
          python -m pytest -q "${files[@]:q*3}"
