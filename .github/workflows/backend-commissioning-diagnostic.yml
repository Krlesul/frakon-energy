name: Backend Commissioning Diagnostic

on:
  push:
    branches:
      - agent/commissioning-data-ui-hardening
    paths:
      - ".github/workflows/backend-commissioning-diagnostic.yml"

permissions:
  contents: read

jobs:
  diagnose:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
        with:
          ref: agent/commissioning-data-ui-hardening
      - uses: actions/setup-python@v6
        with:
          python-version: "3.13"
      - run: python -m pip install --upgrade pip pytest pypdf==6.14.2
      - name: Cumulative first half
        continue-on-error: true
        shell: bash
        run: |
          mapfile -t files < <(grep -oE 'tests/test_[A-Za-z0-9_]+\.py' .github/workflows/backend.yml | awk '!seen[$0]++')
          n=${#files[@]}; half=$(( (n + 1) / 2 ));
          python -m pytest -q "${files[@]:0:half}"
      - name: Cumulative first three quarters
        continue-on-error: true
        shell: bash
        run: |
          mapfile -t files < <(grep -oE 'tests/test_[A-Za-z0-9_]+\.py' .github/workflows/backend.yml | awk '!seen[$0]++')
          n=${#files[@]}; end=$(( (n * 3 + 3) / 4 ));
          python -m pytest -q "${files[@]:0:end}"
      - name: Cumulative last half
        continue-on-error: true
        shell: bash
        run: |
          mapfile -t files < <(grep -oE 'tests/test_[A-Za-z0-9_]+\.py' .github/workflows/backend.yml | awk '!seen[$0]++')
          n=${#files[@]}; start=$(( n / 2 ));
          python -m pytest -q "${files[@]:start}"
      - name: Full backend sequence
        continue-on-error: true
        shell: bash
        run: |
          mapfile -t files < <(grep -oE 'tests/test_[A-Za-z0-9_]+\.py' .github/workflows/backend.yml | awk '!seen[$0]++')
          python -m pytest -q "${files[@]}"
