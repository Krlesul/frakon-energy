name: Backend Commissioning Diagnostic

on:
  push:
    branches:
      - agent/commissioning-data-ui-hardening
    paths:
      - ".github/workflows/backend-commissioning-diagnostic.yml"

permissions:
  contents: read

jobs:
  diagnose:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
        with:
          ref: agent/commissioning-data-ui-hardening
      - uses: actions/setup-python@v6
        with:
          python-version: "3.13"
      - run: python -m pip install --upgrade pip pytest pypdf==6.14.2
      - name: Tests A-F
        continue-on-error: true
        shell: bash
        run: |
          mapfile -t files < <(find tests -maxdepth 1 -type f -name 'test_*.py' -printf '%f\n' | sort | awk 'tolower(substr($0,6,1)) ~ /^[a-f]$/ {print "tests/"$0}')
          python -m pytest -q "${files[@]}"
      - name: Tests G-L
        continue-on-error: true
        shell: bash
        run: |
          mapfile -t files < <(find tests -maxdepth 1 -type f -name 'test_*.py' -printf '%f\n' | sort | awk 'tolower(substr($0,6,1)) ~ /^[g-l]$/ {print "tests/"$0}')
          python -m pytest -q "${files[@]}"
      - name: Tests M-R
        continue-on-error: true
        shell: bash
        run: |
          mapfile -t files < <(find tests -maxdepth 1 -type f -name 'test_*.py' -printf '%f\n' | sort | awk 'tolower(substr($0,6,1)) ~ /^[m-r]$/ {print "tests/"$0}')
          python -m pytest -q "${files[@]}"
      - name: Tests S-Z
        continue-on-error: true
        shell: bash
        run: |
          mapfile -t files < <(find tests -maxdepth 1 -type f -name 'test_*.py' -printf '%f\n' | sort | awk 'tolower(substr($0,6,1)) ~ /^[s-z]$/ {print "tests/"$0}')
          python -m pytest -q "${files[@]}"
