name: Temporary Isolated Customer Test Fix

on:
  push:
    branches:
      - agent/regulated-2026-live-source

permissions:
  contents: write

jobs:
  fix-test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
        with:
          ref: agent/regulated-2026-live-source
          fetch-depth: 0
      - name: Remove customer WebSocket test order dependency
        run: |
          python - <<'PY'
          from pathlib import Path
          path=Path('tests/test_customer_tariff_proposals_ws_api.py')
          source=path.read_text(encoding='utf-8')
          name_anchor='        "custom_components.frakon_energy.tariff_pdf_text",\n'
          if '"custom_components.frakon_energy.tariff_source_context"' not in source:
              source=source.replace(name_anchor, name_anchor + '        "custom_components.frakon_energy.tariff_source_context",\n', 1)
          insert_anchor='''    pdf.extract_validated_tariff_pdf_text = lambda download: calls.append(("extract", download)) or "text"
              sys.modules[pdf.__name__] = pdf

              schemas = []'''
          replacement='''    pdf.extract_validated_tariff_pdf_text = lambda download: calls.append(("extract", download)) or "text"
              sys.modules[pdf.__name__] = pdf

              source_context = types.ModuleType("custom_components.frakon_energy.tariff_source_context")

              class TariffSourceResolutionContext:
                  is_empty = True

                  @classmethod
                  def from_value(cls, value):
                      calls.append(("source_context", value))
                      return cls()

              source_context.TariffSourceResolutionContext = TariffSourceResolutionContext
              source_context.tariff_source_context_fingerprint = lambda _value: "0" * 64
              sys.modules[source_context.__name__] = source_context

              schemas = []'''
          # Normalize indentation in literal because YAML adds indentation only outside heredoc.
          insert_anchor=insert_anchor.replace('              ', '    ')
          replacement=replacement.replace('              ', '    ')
          if 'class TariffSourceResolutionContext:' not in source:
              if source.count(insert_anchor) != 1:
                  raise SystemExit(f'test stub anchor count={source.count(insert_anchor)}')
              source=source.replace(insert_anchor, replacement, 1)
          path.write_text(source, encoding='utf-8')
          PY
          python -m pytest -q tests/test_customer_tariff_proposals_ws_api.py
      - name: Commit test isolation fix
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add tests/test_customer_tariff_proposals_ws_api.py
          if git diff --cached --quiet; then
            echo "No change"
          else
            git commit -m "Isolate customer tariff WebSocket tests"
            git push origin HEAD:agent/regulated-2026-live-source
          fi
