name: Temporary Live CEZ Parser Diagnostic V2

on:
  push:
    branches:
      - agent/fix-tariff-preview-timeout

jobs:
  parse:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-python@v5
        with:
          python-version: '3.13'
      - run: python -m pip install -q pypdf==6.14.2
      - run: curl --fail --location --max-time 25 --output /tmp/cez.pdf 'https://www.cez.cz/file/edee/2025/10/x01_moo_ee_na_dobu_neurcitou.pdf'
      - name: Parse D25d from exact live document
        run: |
          python - <<'PY'
          import importlib.util, sys
          from pypdf import PdfReader
          name = 'cez_parser_live'
          spec = importlib.util.spec_from_file_location(name, 'custom_components/frakon_energy/providers/cez_tariff_parser.py')
          mod = importlib.util.module_from_spec(spec)
          sys.modules[name] = mod
          spec.loader.exec_module(mod)
          text = PdfReader('/tmp/cez.pdf', strict=False).pages[0].extract_text() or ''
          parsed = mod.parse_cez_commercial_price_text(text, distribution_tariff='D25d')
          print(parsed)
          assert parsed.product_name == 'Elektřina na dobu neurčitou'
          assert str(parsed.high_rate_czk_per_kwh) == '3.96'
          assert str(parsed.low_rate_czk_per_kwh) == '3.7'
          assert str(parsed.supplier_standing_czk_month) == '146.41'
          PY
