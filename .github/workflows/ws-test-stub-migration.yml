name: WS Test Stub Migration

on:
  push:
    branches:
      - agent/ha-websocket-admin-compat

permissions:
  contents: write

jobs:
  migrate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
        with:
          ref: agent/ha-websocket-admin-compat
          fetch-depth: 0
      - name: Teach isolated Home Assistant websocket stubs require_admin
        run: |
          python - <<'PY'
          from pathlib import Path

          changed = []
          for path in Path("tests").glob("test_*.py"):
              text = path.read_text(encoding="utf-8")
              if "homeassistant.components.websocket_api" not in text:
                  continue
              if "websocket_api.require_admin" in text:
                  continue
              lines = text.splitlines(keepends=True)
              insert_at = None
              for index, line in enumerate(lines):
                  if "websocket_api.async_response =" in line:
                      insert_at = index
                      break
              if insert_at is None:
                  continue

              assignment_line = lines[insert_at]
              indent = assignment_line[: len(assignment_line) - len(assignment_line.lstrip())]
              block = [
                  f"{indent}def require_admin(func):\n",
                  f"{indent}    async def wrapped(hass, connection, msg):\n",
                  f"{indent}        legacy = getattr(connection, \"require_admin\", None)\n",
                  f"{indent}        if legacy is not None:\n",
                  f"{indent}            legacy()\n",
                  f"{indent}        return await func(hass, connection, msg)\n",
                  f"{indent}    return wrapped\n",
                  "\n",
                  f"{indent}websocket_api.require_admin = require_admin\n",
              ]
              lines[insert_at:insert_at] = block
              path.write_text("".join(lines), encoding="utf-8")
              changed.append(str(path))

          if not changed:
              raise SystemExit("No websocket test stubs required migration")
          print(f"Updated {len(changed)} test websocket stubs")
          for path in changed:
              print(path)
          PY
      - name: Commit test harness migration
        run: |
          if git diff --quiet; then
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add tests
          git commit -m "Update websocket test stubs for current HA admin decorator"
          git push origin HEAD:agent/ha-websocket-admin-compat
