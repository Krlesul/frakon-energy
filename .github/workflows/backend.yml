name: Backend

on:
  push:
    branches:
      - main
  pull_request:
    paths:
      - "custom_components/**"
      - "tests/**"
      - "scripts/release_preflight.py"
      - "hacs.json"
      - "CHANGELOG.md"
      - "VERSION"
      - "frontend/package.json"
      - ".github/workflows/backend.yml"

permissions:
  contents: read

jobs:
  validate:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v5

      - name: Setup Python
        uses: actions/setup-python@v6
        with:
          python-version: "3.13"

      - name: Install test dependencies
        run: python -m pip install --upgrade pip pytest

      - name: Compile integration
        run: python -m compileall -q custom_components/frakon_energy

      - name: Validate JSON files
        run: |
          python - <<'PY'
          import json
          from pathlib import Path
          for path in Path("custom_components/frakon_energy").rglob("*.json"):
              json.loads(path.read_text(encoding="utf-8"))
              print(f"OK {path}")
          json.loads(Path("hacs.json").read_text(encoding="utf-8"))
          print("OK hacs.json")
          PY

      - name: Validate required release files
        run: |
          python - <<'PY'
          from pathlib import Path
          required = [
              Path("VERSION"),
              Path("hacs.json"),
              Path("README.md"),
              Path("CHANGELOG.md"),
              Path("frontend/package.json"),
              Path("custom_components/frakon_energy/__init__.py"),
              Path("custom_components/frakon_energy/manifest.json"),
              Path("custom_components/frakon_energy/config_flow.py"),
              Path("custom_components/frakon_energy/translations/cs.json"),
          ]
          missing = [str(path) for path in required if not path.is_file()]
          if missing:
              raise SystemExit(f"Missing required files: {missing}")
          PY

      - name: Release preflight contract
        run: python scripts/release_preflight.py

      - name: Run backend tests
        run: >-
          python -m pytest -q
          tests/test_domain.py
          tests/test_pricing.py
          tests/test_contracts.py
          tests/test_tariff_sources.py
          tests/test_cez_tariffs.py
          tests/test_eon_tariffs.py
          tests/test_cez_tariff_parser.py
          tests/test_cez_tariff_components.py
          tests/test_pre_tariffs.py
          tests/test_mnd_tariffs.py
          tests/test_tariff_adapter_registry.py
          tests/test_tariff_discovery.py
          tests/test_regulated_pricing.py
          tests/test_tariff_provenance.py
          tests/test_tariff_assembly.py
          tests/test_cz_regulated_sources.py
          tests/test_all_in_catalog.py
          tests/test_tariff_candidate_selection.py
          tests/test_tariff_download.py
          tests/test_tariff_fetch.py
          tests/test_tariff_http_transport.py
          tests/test_tariff_http_ha.py
          tests/test_tariff_source_watch.py
          tests/test_tariff_source_watch_store.py
          tests/test_tariff_source_watch_fetch.py
          tests/test_tariff_update_orchestrator.py
          tests/test_tariff_update_cadence.py
          tests/test_tariff_update_ha.py
          tests/test_tariff_update_runtime.py
          tests/test_tariff_update_notification.py
          tests/test_tariff_runtime_setup_wiring.py