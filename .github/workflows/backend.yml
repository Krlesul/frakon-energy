name: Backend

on:
  push:
    branches:
      - main
      - feat/frakon-energy-1.0-integration
  pull_request:
    paths:
      - "custom_components/**"
      - "tests/**"
      - ".github/workflows/backend.yml"

permissions:
  contents: read

jobs:
  validate:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v5

      - name: Setup Python
        uses: actions/setup-python@v6
        with:
          python-version: "3.13"
          cache: pip

      - name: Install test dependencies
        run: python -m pip install --upgrade pip pytest

      - name: Compile integration
        run: python -m compileall -q custom_components/frakon_energy

      - name: Validate JSON files
        run: |
          python - <<'PY'
          import json
          from pathlib import Path
          for path in Path("custom_components/frakon_energy").rglob("*.json"):
              json.loads(path.read_text(encoding="utf-8"))
              print(f"OK {path}")
          PY

      - name: Run domain tests
        run: python -m pytest -q tests/test_domain.py
