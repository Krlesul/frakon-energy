name: Backend

on:
  push:
    branches:
      - main
      - feat/frakon-energy-1.0-integration
  pull_request:
    paths:
      - "custom_components/**"
      - "tests/**"
      - "hacs.json"
      - "CHANGELOG.md"
      - "VERSION"
      - "frontend/package.json"
      - ".github/workflows/backend.yml"

permissions:
  contents: read

jobs:
  validate:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v5

      - name: Setup Python
        uses: actions/setup-python@v6
        with:
          python-version: "3.13"

      - name: Install test dependencies
        run: python -m pip install --upgrade pip pytest

      - name: Compile integration
        run: python -m compileall -q custom_components/frakon_energy

      - name: Validate JSON files
        run: |
          python - <<'PY'
          import json
          from pathlib import Path
          for path in Path("custom_components/frakon_energy").rglob("*.json"):
              json.loads(path.read_text(encoding="utf-8"))
              print(f"OK {path}")
          json.loads(Path("hacs.json").read_text(encoding="utf-8"))
          print("OK hacs.json")
          PY

      - name: Validate HACS and release structure
        run: |
          python - <<'PY'
          import json
          import re
          from pathlib import Path

          required = [
              Path("VERSION"),
              Path("hacs.json"),
              Path("README.md"),
              Path("CHANGELOG.md"),
              Path("frontend/package.json"),
              Path("custom_components/frakon_energy/__init__.py"),
              Path("custom_components/frakon_energy/manifest.json"),
              Path("custom_components/frakon_energy/config_flow.py"),
              Path("custom_components/frakon_energy/translations/cs.json"),
          ]
          missing = [str(path) for path in required if not path.is_file()]
          if missing:
              raise SystemExit(f"Missing required files: {missing}")

          version = Path("VERSION").read_text(encoding="utf-8").strip()
          if not re.fullmatch(r"\d+\.\d+\.\d+(?:-(?:alpha|beta|rc)\.\d+)?", version):
              raise SystemExit(f"Invalid semantic version: {version}")

          manifest = json.loads(Path("custom_components/frakon_energy/manifest.json").read_text(encoding="utf-8"))
          frontend = json.loads(Path("frontend/package.json").read_text(encoding="utf-8"))
          hacs = json.loads(Path("hacs.json").read_text(encoding="utf-8"))

          assert manifest["domain"] == "frakon_energy"
          assert manifest["config_flow"] is True
          assert manifest["version"] == version
          assert frontend["version"] == version
          assert hacs["name"] == manifest["name"]
          print(f"Validated {manifest['name']} {version}")
          PY

      - name: Run domain tests
        run: python -m pytest -q tests/test_domain.py
