name: Temporary Regulated Source Persist

on:
  push:
    branches:
      - agent/regulated-2026-live-source

permissions:
  contents: write

jobs:
  persist-tested-source:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
        with:
          ref: agent/regulated-2026-live-source
          fetch-depth: 0
      - uses: actions/setup-python@v6
        with:
          python-version: '3.13'
      - uses: actions/setup-node@v5
        with:
          node-version: 24

      - name: Reapply the already validated source patch
        run: |
          python - <<'PY'
          from pathlib import Path
          import textwrap

          workflow = Path('.github/workflows/tmp-regulated-ui-build.yml').read_text(encoding='utf-8')
          start_marker = "          python - <<'PY'\n"
          end_marker = "\n          PY\n"
          start = workflow.find(start_marker)
          if start < 0:
              raise SystemExit('validated patch start marker not found')
          start += len(start_marker)
          end = workflow.find(end_marker, start)
          if end < 0:
              raise SystemExit('validated patch end marker not found')
          script = textwrap.dedent(workflow[start:end])
          Path('/tmp/apply_regulated_patch.py').write_text(script, encoding='utf-8')
          PY
          python /tmp/apply_regulated_patch.py

      - name: Install backend dependencies and rerun regulated regressions
        run: |
          python -m pip install -q pytest pypdf==6.14.2
          python -m compileall -q custom_components/frakon_energy
          python -m pytest -q \
            tests/test_cz_regulated_sources.py \
            tests/test_cz_regulated_2026_catalog.py \
            tests/test_regulated_pricing.py \
            tests/test_regulated_catalog.py \
            tests/test_regulated_proposals.py \
            tests/test_regulated_proposals_ws_api.py \
            tests/test_customer_tariff_proposals.py \
            tests/test_customer_tariff_proposals_ws_api.py \
            tests/test_tariff_assembly.py \
            tests/test_cez_d25d_2026_all_in_commissioning.py

      - name: Validate and build frontend
        working-directory: frontend
        run: |
          npm install
          node --check public/tariff-confirmation-bridge.js
          node scripts/check-tariff-confirmation-authority.mjs
          node scripts/check-runtime-live-data-contract.mjs
          npm run build

      - name: Package frontend
        run: |
          rm -rf custom_components/frakon_energy/frontend_app
          mkdir -p custom_components/frakon_energy/frontend_app
          cp -R frontend/dist/. custom_components/frakon_energy/frontend_app/
          cmp frontend/public/tariff-confirmation-bridge.js custom_components/frakon_energy/frontend_app/tariff-confirmation-bridge.js

      - name: Persist source without workflow files
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add \
            custom_components/frakon_energy/cz_regulated_2026_catalog.py \
            frontend/public/tariff-confirmation-bridge.js \
            custom_components/frakon_energy/frontend_app
          git diff --cached --check
          if git diff --cached --quiet; then
            echo "No source changes to persist"
          else
            git commit -m "Wire official regulated confirmation into tariff flow"
            git push origin HEAD:agent/regulated-2026-live-source
          fi
