name: Sync tariff wizard frontend

on:
  push:
    branches:
      - agent/tariff-wizard-frontend
    paths:
      - "frontend/**"
      - ".github/workflows/sync-tariff-wizard-frontend.yml"

permissions:
  contents: write

jobs:
  sync:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - name: Checkout branch
        uses: actions/checkout@v5
        with:
          ref: ${{ github.ref_name }}

      - name: Setup Node
        uses: actions/setup-node@v6
        with:
          node-version: "22"
          cache: npm
          cache-dependency-path: frontend/package-lock.json

      - name: Install dependencies
        working-directory: frontend
        run: npm install --no-audit --no-fund

      - name: Build dashboard
        working-directory: frontend
        run: npm run build

      - name: Sync built dashboard
        run: |
          rm -rf custom_components/frakon_energy/frontend_app
          mkdir -p custom_components/frakon_energy/frontend_app
          cp -R frontend/dist/. custom_components/frakon_energy/frontend_app/

      - name: Commit generated dashboard
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add custom_components/frakon_energy/frontend_app
          if git diff --cached --quiet; then
            echo "Generated dashboard already matches the source"
            exit 0
          fi
          git commit -m "build: sync tariff wizard frontend"
          git push origin "HEAD:${GITHUB_REF_NAME}"
