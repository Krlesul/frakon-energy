name: Frontend Authority Diagnostic

on:
  push:
    branches:
      - agent/commissioning-data-ui-hardening
    paths:
      - ".github/workflows/frontend-authority-diagnostic.yml"

permissions:
  contents: read

jobs:
  diagnose:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
        with:
          ref: agent/commissioning-data-ui-hardening
      - uses: actions/setup-node@v5
        with:
          node-version: 24
      - name: Tariff confirmation syntax
        working-directory: frontend
        run: node --check public/tariff-confirmation-bridge.js
      - name: Tariff confirmation authority
        working-directory: frontend
        run: node scripts/check-tariff-confirmation-authority.mjs
      - name: MND syntax
        working-directory: frontend
        run: node --check public/mnd-source-confirmation-bridge.js
      - name: MND authority
        working-directory: frontend
        run: node scripts/check-mnd-source-confirmation-authority.mjs
      - name: Parser preview syntax
        working-directory: frontend
        run: node --check public/supplier-parser-preview-bridge.js
      - name: Parser preview authority
        working-directory: frontend
        run: node scripts/check-supplier-parser-preview-authority.mjs
      - name: Manual tariff syntax
        working-directory: frontend
        run: node --check public/manual-tariff-entry-bridge.js
      - name: Manual tariff authority
        working-directory: frontend
        run: node scripts/check-manual-tariff-entry-authority.mjs
      - name: Load estimate syntax
        working-directory: frontend
        run: node --check public/load-all-in-estimate-bridge.js
      - name: Load estimate authority
        working-directory: frontend
        run: node scripts/check-load-all-in-estimate-authority.mjs
      - name: Legacy migration syntax
        working-directory: frontend
        run: node --check public/legacy-tariff-migration-bridge.js
      - name: Legacy migration authority
        working-directory: frontend
        run: node scripts/check-legacy-tariff-migration-authority.mjs
      - name: Runtime commissioning contract
        working-directory: frontend
        run: node scripts/check-runtime-live-data-contract.mjs
