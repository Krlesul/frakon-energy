name: Release

on:
  push:
    branches:
      - main
    tags:
      - "*.*.*"
    paths:
      - ".github/workflows/release.yml"
      - "scripts/release_preflight.py"
      - "scripts/release_notes.py"
      - "VERSION"
      - "CHANGELOG.md"
      - "hacs.json"
      - "frontend/package.json"
      - "custom_components/frakon_energy/manifest.json"
  pull_request:
    paths:
      - ".github/workflows/release.yml"
      - "scripts/release_preflight.py"
      - "scripts/release_notes.py"
      - "VERSION"
      - "CHANGELOG.md"
      - "hacs.json"
      - "frontend/**"
      - "custom_components/frakon_energy/frontend_app/**"
      - "custom_components/frakon_energy/manifest.json"
      - "tests/test_versioning.py"

permissions:
  contents: read

jobs:
  validate:
    runs-on: ubuntu-latest
    outputs:
      version: ${{ steps.version.outputs.version }}
      github_prerelease: ${{ steps.version.outputs.github_prerelease }}
    steps:
      - name: Checkout candidate commit
        uses: actions/checkout@v5
        with:
          fetch-depth: 0

      - name: Setup Python
        uses: actions/setup-python@v6
        with:
          python-version: "3.14.2"

      - name: Setup Node.js
        uses: actions/setup-node@v5
        with:
          node-version: 24

      - name: Install release test dependencies
        run: >-
          python -m pip install --upgrade pip
          pytest pytest-asyncio
          "homeassistant==2026.7.0"

      - name: Install integration requirements
        shell: bash
        run: |
          set -euo pipefail
          python - <<'PY' > /tmp/frakon-integration-requirements.txt
          import json
          from pathlib import Path

          manifest = json.loads(
              Path("custom_components/frakon_energy/manifest.json").read_text(
                  encoding="utf-8"
              )
          )
          requirements = manifest.get("requirements", [])
          if not isinstance(requirements, list) or any(
              not isinstance(item, str) or not item.strip() for item in requirements
          ):
              raise SystemExit("manifest requirements must be a list of non-empty strings")
          for requirement in requirements:
              print(requirement.strip())
          PY
          if [[ -s /tmp/frakon-integration-requirements.txt ]]; then
            python -m pip install -r /tmp/frakon-integration-requirements.txt
          fi

      - name: Verify release identity
        id: version
        shell: bash
        run: |
          set -euo pipefail
          version="$(tr -d '\r\n' < VERSION)"
          expected_tag="${version}"

          if [[ "${GITHUB_EVENT_NAME}" == "push" && "${GITHUB_REF}" == refs/tags/* ]]; then
            actual_tag="${GITHUB_REF_NAME}"
            if [[ "${actual_tag}" != "${expected_tag}" ]]; then
              echo "Tag ${actual_tag} does not match VERSION ${version}; expected ${expected_tag}" >&2
              exit 1
            fi
            git fetch origin main --no-tags
            if ! git merge-base --is-ancestor "${GITHUB_SHA}" origin/main; then
              echo "Tagged commit ${GITHUB_SHA} is not reachable from main" >&2
              exit 1
            fi
          elif [[ "${GITHUB_EVENT_NAME}" == "push" && "${GITHUB_REF}" == "refs/heads/main" ]]; then
            echo "Main release candidate: ${expected_tag}"
          else
            echo "PR dry-run: release tag would be ${expected_tag}"
          fi

          # Alpha/beta builds stay behind HACS' beta switch. RC builds are
          # intentionally normal GitHub Releases so HACS can show the semantic
          # version to commissioning users without falling back to a commit SHA.
          if [[ "${version}" == *-alpha.* || "${version}" == *-beta.* ]]; then
            github_prerelease=true
          else
            github_prerelease=false
          fi
          echo "version=${version}" >> "${GITHUB_OUTPUT}"
          echo "github_prerelease=${github_prerelease}" >> "${GITHUB_OUTPUT}"

      - name: Release preflight contract
        run: python scripts/release_preflight.py

      - name: Verify release notes are extractable
        run: python scripts/release_notes.py "${{ steps.version.outputs.version }}" > /tmp/release-notes.md

      - name: Compile integration
        run: python -m compileall -q custom_components/frakon_energy

      - name: Backend tests A-F
        shell: bash
        run: |
          mapfile -t files < <(find tests -maxdepth 1 -type f -name 'test_*.py' -printf '%f\n' | sort | awk 'tolower(substr($0,6,1)) ~ /^[a-f]$/ {print "tests/"$0}')
          if ((${#files[@]})); then python -m pytest -q "${files[@]}"; fi

      - name: Backend tests G-L
        shell: bash
        run: |
          mapfile -t files < <(find tests -maxdepth 1 -type f -name 'test_*.py' -printf '%f\n' | sort | awk 'tolower(substr($0,6,1)) ~ /^[g-l]$/ {print "tests/"$0}')
          if ((${#files[@]})); then python -m pytest -q --junitxml=pytest-g-l.xml "${files[@]}"; fi

      - name: Upload G-L pytest diagnostics
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: pytest-g-l-${{ github.run_id }}-${{ github.run_attempt }}
          path: pytest-g-l.xml
          if-no-files-found: ignore
          retention-days: 1

      - name: Backend tests M-R
        shell: bash
        run: |
          mapfile -t files < <(find tests -maxdepth 1 -type f -name 'test_*.py' -printf '%f\n' | sort | awk 'tolower(substr($0,6,1)) ~ /^[m-r]$/ {print "tests/"$0}')
          if ((${#files[@]})); then python -m pytest -q "${files[@]}"; fi

      - name: Backend tests S-Z
        shell: bash
        run: |
          mapfile -t files < <(find tests -maxdepth 1 -type f -name 'test_*.py' -printf '%f\n' | sort | awk 'tolower(substr($0,6,1)) ~ /^[s-z]$/ {print "tests/"$0}')
          if ((${#files[@]})); then python -m pytest -q "${files[@]}"; fi

      - name: Install frontend dependencies
        working-directory: frontend
        run: npm install

      - name: Type-check and build frontend
        working-directory: frontend
        run: npm run build

      - name: Verify packaged dashboard matches candidate source
        run: |
          rm -rf /tmp/frakon-energy-frontend-app
          mkdir -p /tmp/frakon-energy-frontend-app
          cp -R frontend/dist/. /tmp/frakon-energy-frontend-app/
          diff -ru /tmp/frakon-energy-frontend-app custom_components/frakon_energy/frontend_app

      - name: Build HACS release archive
        shell: bash
        run: |
          set -euo pipefail
          python - <<'PY'
          from pathlib import Path
          from zipfile import ZIP_DEFLATED, ZipFile

          archive = Path("frakon-energy.zip")
          source = Path("custom_components/frakon_energy")
          with ZipFile(archive, "w", compression=ZIP_DEFLATED) as zf:
              for path in sorted(source.rglob("*")):
                  if path.is_file():
                      zf.write(path, path.relative_to("custom_components"))
          print(archive)
          PY

      - name: Upload validated release artifact
        uses: actions/upload-artifact@v4
        with:
          name: frakon-energy-${{ steps.version.outputs.version }}
          path: frakon-energy.zip
          if-no-files-found: error
          retention-days: 7

  publish:
    if: github.event_name == 'push'
    needs: validate
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - name: Checkout release commit
        uses: actions/checkout@v5
        with:
          fetch-depth: 0

      - name: Setup Python
        uses: actions/setup-python@v6
        with:
          python-version: "3.14.2"

      - name: Download validated HACS artifact
        uses: actions/download-artifact@v5
        with:
          name: frakon-energy-${{ needs.validate.outputs.version }}

      - name: Publish semantic GitHub Release
        env:
          GH_TOKEN: ${{ github.token }}
          VERSION: ${{ needs.validate.outputs.version }}
          GITHUB_PRERELEASE: ${{ needs.validate.outputs.github_prerelease }}
        shell: bash
        run: |
          set -euo pipefail
          tag="${VERSION}"

          if gh release view "${tag}" >/dev/null 2>&1; then
            echo "Release ${tag} already exists; nothing to publish."
            exit 0
          fi

          git fetch origin --tags --force
          if git rev-parse -q --verify "refs/tags/${tag}" >/dev/null; then
            tag_sha="$(git rev-list -n 1 "refs/tags/${tag}")"
            if [[ "${tag_sha}" != "${GITHUB_SHA}" ]]; then
              echo "Tag ${tag} already points to ${tag_sha}, not current release commit ${GITHUB_SHA}. Bump VERSION before publishing another release." >&2
              exit 1
            fi
          else
            if [[ "${GITHUB_REF}" != "refs/heads/main" ]]; then
              echo "Expected existing tag ${tag} for tag-triggered release." >&2
              exit 1
            fi
            git tag "${tag}" "${GITHUB_SHA}"
            git push origin "refs/tags/${tag}"
          fi

          python scripts/release_notes.py "${VERSION}" > release-notes.md

          args=(
            "${tag}"
            "frakon-energy.zip"
            --title "FRAKON Energy ${VERSION}"
            --notes-file release-notes.md
            --verify-tag
          )
          if [[ "${GITHUB_PRERELEASE}" == "true" ]]; then
            args+=(--prerelease)
          fi
          gh release create "${args[@]}"
