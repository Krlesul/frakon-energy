name: Frontend

on:
  push:
    branches:
      - main
    paths:
      - "frontend/**"
      - "custom_components/frakon_energy/frontend_app/**"
      - ".github/workflows/frontend.yml"
  pull_request:
    paths:
      - "frontend/**"
      - "custom_components/frakon_energy/frontend_app/**"
      - ".github/workflows/frontend.yml"

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v5

      - name: Setup Node.js
        uses: actions/setup-node@v5
        with:
          node-version: 24

      - name: Install dependencies
        working-directory: frontend
        run: npm install

      - name: Validate tariff confirmation bridge
        working-directory: frontend
        run: |
          node --check public/tariff-confirmation-bridge.js
          node scripts/check-tariff-confirmation-authority.mjs
          node --check public/mnd-source-confirmation-bridge.js
          node scripts/check-mnd-source-confirmation-authority.mjs
          node --check public/supplier-parser-preview-bridge.js
          node scripts/check-supplier-parser-preview-authority.mjs
          node --check public/manual-tariff-entry-bridge.js
          node scripts/check-manual-tariff-entry-authority.mjs
          node --check public/load-all-in-estimate-bridge.js
          node scripts/check-load-all-in-estimate-authority.mjs

      - name: Type-check and build
        working-directory: frontend
        run: npm run build

      - name: Package dashboard inside the integration
        run: |
          rm -rf custom_components/frakon_energy/frontend_app
          mkdir -p custom_components/frakon_energy/frontend_app
          cp -R frontend/dist/. custom_components/frakon_energy/frontend_app/
          test -f custom_components/frakon_energy/frontend_app/index.html
          cmp frontend/public/tariff-confirmation-bridge.js custom_components/frakon_energy/frontend_app/tariff-confirmation-bridge.js
          cmp frontend/public/mnd-source-confirmation-bridge.js custom_components/frakon_energy/frontend_app/mnd-source-confirmation-bridge.js
          cmp frontend/public/supplier-parser-preview-bridge.js custom_components/frakon_energy/frontend_app/supplier-parser-preview-bridge.js
          cmp frontend/public/manual-tariff-entry-bridge.js custom_components/frakon_energy/frontend_app/manual-tariff-entry-bridge.js
          cmp frontend/public/load-all-in-estimate-bridge.js custom_components/frakon_energy/frontend_app/load-all-in-estimate-bridge.js

      - name: Verify committed dashboard is current
        run: |
          if ! git diff --exit-code -- custom_components/frakon_energy/frontend_app; then
            echo "Packaged frontend_app is stale. Build frontend locally and commit the generated dashboard."
            exit 1
          fi
