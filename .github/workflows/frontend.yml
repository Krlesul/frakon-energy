name: Frontend

on:
  push:
    branches:
      - main
    paths:
      - "frontend/**"
      - "custom_components/frakon_energy/frontend_app/**"
      - ".github/workflows/frontend.yml"
  pull_request:
    paths:
      - "frontend/**"
      - "custom_components/frakon_energy/frontend_app/**"
      - ".github/workflows/frontend.yml"

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v5

      - name: Setup Node.js
        uses: actions/setup-node@v5
        with:
          node-version: 24

      - name: Install dependencies
        working-directory: frontend
        run: npm install

      - name: Validate tariff confirmation bridge
        working-directory: frontend
        run: node --check public/tariff-confirmation-bridge.js

      - name: Type-check and build
        working-directory: frontend
        run: npm run build

      - name: Package dashboard inside the integration
        run: |
          rm -rf custom_components/frakon_energy/frontend_app
          mkdir -p custom_components/frakon_energy/frontend_app
          cp -R frontend/dist/. custom_components/frakon_energy/frontend_app/
          test -f custom_components/frakon_energy/frontend_app/index.html

      - name: Upload packaged dashboard
        uses: actions/upload-artifact@v4
        with:
          name: frontend-app
          path: custom_components/frakon_energy/frontend_app
          if-no-files-found: error

      - name: Verify committed dashboard is current
        run: |
          if ! git diff --exit-code -- custom_components/frakon_energy/frontend_app; then
            echo "Packaged frontend_app is stale. Build frontend locally and commit the generated dashboard."
            exit 1
          fi
