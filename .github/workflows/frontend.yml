name: Frontend

on:
  push:
    branches:
      - main
      - feat/energy-dashboard-shell
      - feat/frakon-energy-1.0-integration
    paths:
      - "frontend/**"
      - ".github/workflows/frontend.yml"
  pull_request:
    paths:
      - "frontend/**"
      - ".github/workflows/frontend.yml"
      - "custom_components/frakon_energy/frontend/**"

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v5
        with:
          ref: ${{ github.head_ref || github.ref_name }}

      - name: Setup Node.js
        uses: actions/setup-node@v5
        with:
          node-version: 24

      - name: Install dependencies
        working-directory: frontend
        run: npm install

      - name: Type-check and build
        working-directory: frontend
        run: npm run build

      - name: Package dashboard inside the integration
        run: |
          rm -rf custom_components/frakon_energy/frontend_app
          mkdir -p custom_components/frakon_energy/frontend_app
          cp -R frontend/dist/. custom_components/frakon_energy/frontend_app/
          test -f custom_components/frakon_energy/frontend_app/index.html

      - name: Commit generated dashboard
        if: github.event_name == 'push' && github.actor != 'github-actions[bot]'
        run: |
          if git diff --quiet -- custom_components/frakon_energy/frontend_app; then
            echo "Dashboard build is already current"
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add custom_components/frakon_energy/frontend_app
          git commit -m "build: package FRAKON Energy dashboard [skip ci]"
          git push
