name: Frontend

on:
  push:
    branches:
      - main
    paths:
      - "frontend/**"
      - "custom_components/frakon_energy/frontend_app/**"
      - ".github/workflows/frontend.yml"
  pull_request:
    paths:
      - "frontend/**"
      - "custom_components/frakon_energy/frontend_app/**"
      - ".github/workflows/frontend.yml"

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v5
        with:
          ref: ${{ github.head_ref || github.ref_name }}

      - name: Setup Node.js
        uses: actions/setup-node@v5
        with:
          node-version: 24

      - name: Install dependencies
        working-directory: frontend
        run: npm install

      - name: Type-check and build
        working-directory: frontend
        run: npm run build

      - name: Package dashboard inside the integration
        run: |
          rm -rf custom_components/frakon_energy/frontend_app
          mkdir -p custom_components/frakon_energy/frontend_app
          cp -R frontend/dist/. custom_components/frakon_energy/frontend_app/
          test -f custom_components/frakon_energy/frontend_app/index.html

      - name: Temporary sync for tariff wizard branch
        if: >-
          github.event_name == 'pull_request' &&
          github.event.pull_request.head.repo.full_name == github.repository &&
          github.head_ref == 'agent/tariff-wizard-frontend' &&
          github.actor != 'github-actions[bot]'
        run: |
          if git diff --quiet -- custom_components/frakon_energy/frontend_app; then
            echo "Generated dashboard already matches the source"
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add custom_components/frakon_energy/frontend_app
          git commit -m "build: sync tariff wizard frontend"
          git push origin "HEAD:${GITHUB_HEAD_REF}"

      - name: Verify committed dashboard is current
        run: |
          if ! git diff --exit-code -- custom_components/frakon_energy/frontend_app; then
            echo "Packaged frontend_app is stale. Build frontend locally and commit the generated dashboard."
            exit 1
          fi
