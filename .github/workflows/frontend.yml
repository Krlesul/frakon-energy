name: Frontend

on:
  push:
    branches:
      - main
    paths:
      - "frontend/**"
      - "custom_components/frakon_energy/frontend_app/**"
      - ".github/workflows/frontend.yml"
  pull_request:
    paths:
      - "frontend/**"
      - "custom_components/frakon_energy/frontend_app/**"
      - ".github/workflows/frontend.yml"

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v5
        with:
          ref: ${{ github.event_name == 'pull_request' && github.event.pull_request.head.sha || github.sha }}

      - name: Setup Node.js
        uses: actions/setup-node@v5
        with:
          node-version: 24

      - name: Install dependencies
        working-directory: frontend
        run: npm install

      - name: Validate tariff confirmation bridge
        working-directory: frontend
        run: |
          node --check public/tariff-confirmation-bridge.js
          node scripts/check-tariff-confirmation-authority.mjs
          node --check public/mnd-source-confirmation-bridge.js
          node scripts/check-mnd-source-confirmation-authority.mjs
          node --check public/supplier-parser-preview-bridge.js
          node scripts/check-supplier-parser-preview-authority.mjs
          node --check public/manual-tariff-entry-bridge.js
          node scripts/check-manual-tariff-entry-authority.mjs
          node --check public/load-all-in-estimate-bridge.js
          node scripts/check-load-all-in-estimate-authority.mjs
          node --check public/legacy-tariff-migration-bridge.js
          node scripts/check-legacy-tariff-migration-authority.mjs
          node scripts/check-runtime-live-data-contract.mjs

      - name: Type-check and build
        working-directory: frontend
        run: npm run build

      - name: Package dashboard inside the integration
        run: |
          rm -rf custom_components/frakon_energy/frontend_app
          mkdir -p custom_components/frakon_energy/frontend_app
          cp -R frontend/dist/. custom_components/frakon_energy/frontend_app/
          test -f custom_components/frakon_energy/frontend_app/index.html
          cmp frontend/public/tariff-confirmation-bridge.js custom_components/frakon_energy/frontend_app/tariff-confirmation-bridge.js
          cmp frontend/public/mnd-source-confirmation-bridge.js custom_components/frakon_energy/frontend_app/mnd-source-confirmation-bridge.js
          cmp frontend/public/supplier-parser-preview-bridge.js custom_components/frakon_energy/frontend_app/supplier-parser-preview-bridge.js
          cmp frontend/public/manual-tariff-entry-bridge.js custom_components/frakon_energy/frontend_app/manual-tariff-entry-bridge.js
          cmp frontend/public/load-all-in-estimate-bridge.js custom_components/frakon_energy/frontend_app/load-all-in-estimate-bridge.js
          cmp frontend/public/legacy-tariff-migration-bridge.js custom_components/frakon_energy/frontend_app/legacy-tariff-migration-bridge.js

      - name: Upload validated dashboard build
        uses: actions/upload-artifact@v4
        with:
          name: frakon-energy-frontend-${{ github.sha }}
          path: custom_components/frakon_energy/frontend_app
          if-no-files-found: error
          retention-days: 7

      - name: Sync validated dashboard to same-repository PR branch
        if: github.event_name == 'pull_request' && github.event.pull_request.head.repo.full_name == github.repository
        shell: bash
        env:
          HEAD_REF: ${{ github.event.pull_request.head.ref }}
        run: |
          set -euo pipefail
          if git diff --quiet -- custom_components/frakon_energy/frontend_app; then
            echo "Committed dashboard already matches the validated build."
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add custom_components/frakon_energy/frontend_app
          git commit -m "Sync validated frontend dashboard"
          git push origin "HEAD:${HEAD_REF}"

      - name: Verify committed dashboard is current
        run: |
          if ! git diff --exit-code -- custom_components/frakon_energy/frontend_app; then
            echo "Packaged frontend_app is stale. Download the validated dashboard artifact from this run and commit it."
            exit 1
          fi
