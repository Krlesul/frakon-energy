name: Commissioning Hardening Build

on:
  push:
    branches:
      - agent/commissioning-data-ui-hardening
    paths:
      - ".github/workflows/commissioning-hardening-build.yml"

permissions:
  contents: write

jobs:
  validate-build-package:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout candidate
        uses: actions/checkout@v5
        with:
          ref: agent/commissioning-data-ui-hardening

      - name: Setup Python
        uses: actions/setup-python@v6
        with:
          python-version: "3.13"

      - name: Install targeted test dependencies
        run: python -m pip install --upgrade pip pytest

      - name: Compile integration
        run: python -m compileall -q custom_components/frakon_energy

      - name: Run commissioning regression tests
        run: >-
          python -m pytest -q
          tests/test_domain.py
          tests/test_contracts.py
          tests/test_billing_all_in_wiring.py

      - name: Setup Node.js
        uses: actions/setup-node@v5
        with:
          node-version: 24

      - name: Install frontend dependencies
        working-directory: frontend
        run: npm install

      - name: Validate runtime commissioning contract
        working-directory: frontend
        run: node scripts/check-runtime-live-data-contract.mjs

      - name: Type-check and build frontend
        working-directory: frontend
        run: npm run build

      - name: Package dashboard inside integration
        run: |
          rm -rf custom_components/frakon_energy/frontend_app
          mkdir -p custom_components/frakon_energy/frontend_app
          cp -R frontend/dist/. custom_components/frakon_energy/frontend_app/

      - name: Commit generated dashboard
        shell: bash
        run: |
          if git diff --quiet -- custom_components/frakon_energy/frontend_app; then
            echo "Packaged dashboard already matches source."
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add custom_components/frakon_energy/frontend_app
          git commit -m "Build commissioning hardening frontend"
          git push origin HEAD:agent/commissioning-data-ui-hardening
