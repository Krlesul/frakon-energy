name: Temporary 2026 Regulated Source Diagnostic

on:
  push:
    branches:
      - agent/regulated-2026-live-source

permissions:
  contents: read

jobs:
  inspect-official-sources:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-python@v5
        with:
          python-version: '3.13'
      - name: Install diagnostic dependencies
        run: python -m pip install -q openpyxl pypdf
      - name: Download official ERU sources
        run: |
          curl --fail --location --max-time 30 -o /tmp/ceny-nn26-1.xlsx 'https://eru.gov.cz/sites/default/files/obsah/prilohy/ceny-nn26-1.xlsx'
          curl --fail --location --max-time 30 -o /tmp/erv172025.pdf 'https://eru.gov.cz/sites/default/files/obsah/prilohy/erv172025.pdf'
          curl --fail --location --max-time 30 -o /tmp/erv192025.pdf 'https://eru.gov.cz/sites/default/files/obsah/prilohy/erv192025.pdf'
          curl --fail --location --max-time 30 -o /tmp/erv022026.pdf 'https://eru.gov.cz/sites/default/files/obsah/prilohy/erv022026.pdf'
          sha256sum /tmp/ceny-nn26-1.xlsx /tmp/erv172025.pdf /tmp/erv192025.pdf /tmp/erv022026.pdf
      - name: Inspect exact D25d section
        run: |
          python - <<'PY'
          from openpyxl import load_workbook
          wb=load_workbook('/tmp/ceny-nn26-1.xlsx', data_only=True, read_only=True)
          ws=wb['Distribuce']
          rows=list(ws.iter_rows(values_only=True))
          starts=[]
          for idx,row in enumerate(rows):
              first='' if not row or row[0] is None else str(row[0])
              norm=' '.join(first.replace('\xa0',' ').split()).lower()
              if 'sazba d 25d' in norm or 'sazba d25d' in norm:
                  starts.append(idx)
          print('D25D_STARTS', [x+1 for x in starts])
          if len(starts) != 1:
              raise SystemExit(f'expected exactly one D25d section, got {starts}')
          start=starts[0]
          stop=min(len(rows), start+40)
          for i in range(start, stop):
              first='' if not rows[i] or rows[i][0] is None else str(rows[i][0])
              norm=' '.join(first.replace('\xa0',' ').split()).lower()
              if i > start and norm.startswith('sazba '):
                  stop=i
                  break
          for i in range(start, stop):
              vals=['' if v is None else str(v) for v in rows[i][:8]]
              print(f'D25D {i+1}:', ' | '.join(vals))
          PY
      - name: Inspect amendment 1 2026 exact replacements
        run: |
          python - <<'PY'
          from pypdf import PdfReader
          import re
          text='\n'.join((p.extract_text() or '') for p in PdfReader('/tmp/erv022026.pdf', strict=False).pages)
          lines=[re.sub(r'\s+',' ',x).strip() for x in text.splitlines() if x.strip()]
          print('AMENDMENT_TEXT_BEGIN')
          for i,line in enumerate(lines):
              low=line.lower()
              if any(k in low for k in ('nahrazuje','nahrazují','zní','účinnost','164,24','12,87','systémové služby','nesíťové infrastruktury','podporu elektřiny')):
                  lo=max(0,i-2); hi=min(len(lines),i+5)
                  print(f'AMEND {i}:', ' || '.join(lines[lo:hi]))
          print('AMENDMENT_TEXT_END')
          PY
