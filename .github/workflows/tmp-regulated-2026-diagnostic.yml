name: Temporary 2026 Regulated Source Diagnostic

on:
  push:
    branches:
      - agent/regulated-2026-live-source

permissions:
  contents: read

jobs:
  inspect-official-sources:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-python@v5
        with:
          python-version: '3.13'
      - name: Install diagnostic dependencies
        run: python -m pip install -q openpyxl pypdf
      - name: Download official ERU sources
        run: |
          curl --fail --location --max-time 30 -o /tmp/ceny-nn26-1.xlsx 'https://eru.gov.cz/sites/default/files/obsah/prilohy/ceny-nn26-1.xlsx'
          curl --fail --location --max-time 30 -o /tmp/erv172025.pdf 'https://eru.gov.cz/sites/default/files/obsah/prilohy/erv172025.pdf'
          curl --fail --location --max-time 30 -o /tmp/erv192025.pdf 'https://eru.gov.cz/sites/default/files/obsah/prilohy/erv192025.pdf'
          curl --fail --location --max-time 30 -o /tmp/erv022026.pdf 'https://eru.gov.cz/sites/default/files/obsah/prilohy/erv022026.pdf'
          sha256sum /tmp/ceny-nn26-1.xlsx /tmp/erv172025.pdf /tmp/erv192025.pdf /tmp/erv022026.pdf
      - name: Inspect ERU low-voltage workbook
        run: |
          python - <<'PY'
          from openpyxl import load_workbook
          p='/tmp/ceny-nn26-1.xlsx'
          wb=load_workbook(p, data_only=True, read_only=True)
          print('SHEETS', wb.sheetnames)
          for ws in wb.worksheets:
              print('\n===', ws.title, ws.max_row, ws.max_column, '===')
              rows=[]
              for r in ws.iter_rows(values_only=True):
                  vals=['' if v is None else str(v) for v in r]
                  joined=' | '.join(vals)
                  if ('D25d' in joined or 'ČEZ Distribuce' in joined or 'CEZ Distribuce' in joined or 'ČEZ' in joined and 'Distribuce' in joined):
                      rows.append(vals)
              for vals in rows[:80]:
                  print('MATCH', ' | '.join(vals))
              # print first 35 rows to preserve header/column semantics
              for i,r in enumerate(ws.iter_rows(min_row=1, max_row=min(ws.max_row,35), values_only=True),1):
                  print(f'HEAD {i}:', ' | '.join('' if v is None else str(v) for v in r))
          PY
      - name: Inspect current non-distribution regulated measures
        run: |
          python - <<'PY'
          from pypdf import PdfReader
          import re
          for path in ('/tmp/erv172025.pdf','/tmp/erv192025.pdf','/tmp/erv022026.pdf'):
              print('\n===== PDF', path, '=====')
              reader=PdfReader(path, strict=False)
              text='\n'.join((p.extract_text() or '') for p in reader.pages)
              print('pages', len(reader.pages), 'chars', len(text))
              lines=[re.sub(r'\s+',' ',x).strip() for x in text.splitlines()]
              keys=('systémov','nesíť','nesit','operátora trhu','operatora trhu','podporované zdroje','podporovanych zdroju','odchylek','zúčtování','zuctovani','elektřiny odebrané','elektriny odebrane')
              for i,line in enumerate(lines):
                  low=line.lower()
                  if any(k in low for k in keys):
                      lo=max(0,i-2); hi=min(len(lines),i+4)
                      print('CTX', ' || '.join(lines[lo:hi]))
          PY
