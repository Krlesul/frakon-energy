name: WS Decorator Migration

on:
  push:
    branches:
      - agent/ha-websocket-admin-compat

permissions:
  contents: write

jobs:
  migrate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
        with:
          ref: agent/ha-websocket-admin-compat
          fetch-depth: 0
      - name: Migrate production handlers and isolated websocket test stubs
        run: |
          python - <<'PY'
          from pathlib import Path

          root = Path("custom_components/frakon_energy")
          changed_prod = []
          migrated_handlers = 0
          for path in root.rglob("*.py"):
              text = path.read_text(encoding="utf-8")
              if "ensure_admin(connection)" not in text:
                  continue

              text = text.replace("from .ws_auth import ensure_admin\n", "")
              text = text.replace("from ..ws_auth import ensure_admin\n", "")
              lines = text.splitlines(keepends=True)
              call_indexes = [
                  index
                  for index, line in enumerate(lines)
                  if line.strip() == "ensure_admin(connection)"
              ]

              # Work backwards so decorator insertion never invalidates indexes
              # for handlers earlier in the file.
              for call_index in reversed(call_indexes):
                  def_index = None
                  for index in range(call_index - 1, -1, -1):
                      if lines[index].lstrip().startswith("async def "):
                          def_index = index
                          break
                  if def_index is None:
                      raise SystemExit(f"No async handler found for admin call in {path}")

                  async_decorator_index = None
                  for index in range(def_index - 1, -1, -1):
                      stripped = lines[index].strip()
                      if stripped == "@websocket_api.async_response":
                          async_decorator_index = index
                          break
                      if stripped and not stripped.startswith("@"):
                          break
                  if async_decorator_index is None:
                      raise SystemExit(
                          f"No async_response decorator found for admin handler in {path}"
                      )

                  indent = lines[async_decorator_index][
                      : len(lines[async_decorator_index])
                      - len(lines[async_decorator_index].lstrip())
                  ]
                  decorator_line = f"{indent}@websocket_api.require_admin\n"
                  if (
                      async_decorator_index == 0
                      or lines[async_decorator_index - 1] != decorator_line
                  ):
                      lines.insert(async_decorator_index, decorator_line)
                      if async_decorator_index <= call_index:
                          call_index += 1

                  del lines[call_index]
                  migrated_handlers += 1

              new_text = "".join(lines)
              if "ensure_admin(connection)" in new_text:
                  raise SystemExit(f"Admin call remained after migration in {path}")
              path.write_text(new_text, encoding="utf-8")
              changed_prod.append(str(path))

          if not changed_prod:
              raise SystemExit("No production websocket handlers were migrated")

          # Isolated unit tests replace Home Assistant with a tiny fake module.
          # Teach those fakes the current HA require_admin decorator while
          # retaining their existing admin_calls assertions.
          changed_tests = []
          for path in Path("tests").glob("test_*ws_api.py"):
              text = path.read_text(encoding="utf-8")
              if "websocket_api.async_response = async_response" not in text:
                  continue
              if "websocket_api.require_admin = require_admin" in text:
                  continue
              marker = "    def async_response(func):\n        return func\n"
              if marker not in text:
                  continue
              addition = marker + "\n    def require_admin(func):\n        async def wrapped(hass, connection, msg):\n            legacy = getattr(connection, \"require_admin\", None)\n            if legacy is not None:\n                legacy()\n            return await func(hass, connection, msg)\n        return wrapped\n"
              text = text.replace(marker, addition, 1)
              assign = "    websocket_api.async_response = async_response\n"
              text = text.replace(
                  assign,
                  assign + "    websocket_api.require_admin = require_admin\n",
                  1,
              )
              path.write_text(text, encoding="utf-8")
              changed_tests.append(str(path))

          # The shared helper was only an intermediate migration step.
          helper = root / "ws_auth.py"
          if helper.exists():
              helper.unlink()

          domain = Path("tests/test_domain.py")
          text = domain.read_text(encoding="utf-8")
          old = '''def test_websocket_admin_guard_matches_current_home_assistant_contract() -> None:\n    source = (ROOT / "ws_auth.py").read_text(encoding="utf-8")\n    assert "connection.require_admin()" not in source\n    assert "user.is_admin" in source\n    assert "Unauthorized" in source\n'''
          new = '''def test_websocket_admin_handlers_use_current_home_assistant_decorator() -> None:\n    admin_modules = [\n        path\n        for path in ROOT.rglob("*_ws_api.py")\n        if "@websocket_api.require_admin" in path.read_text(encoding="utf-8")\n    ]\n    assert admin_modules\n    for path in admin_modules:\n        source = path.read_text(encoding="utf-8")\n        assert "ensure_admin(connection)" not in source\n        assert "connection.require_admin()" not in source\n'''
          if old not in text:
              raise SystemExit("Expected domain regression block not found")
          domain.write_text(text.replace(old, new, 1), encoding="utf-8")

          leftovers = []
          for path in root.rglob("*.py"):
              src = path.read_text(encoding="utf-8")
              if "connection.require_admin()" in src or "ensure_admin(connection)" in src:
                  leftovers.append(str(path))
          if leftovers:
              raise SystemExit("Legacy admin calls remain: " + ", ".join(leftovers))

          print(f"Migrated production modules: {len(changed_prod)}")
          print(f"Migrated admin handlers: {migrated_handlers}")
          print(f"Updated isolated WS test stubs: {len(changed_tests)}")
          PY
      - name: Compile migrated integration
        run: python -m compileall -q custom_components/frakon_energy
      - name: Commit migration
        run: |
          if git diff --quiet; then
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add custom_components/frakon_energy tests
          git commit -m "Use current Home Assistant websocket admin decorator"
          git push origin HEAD:agent/ha-websocket-admin-compat
