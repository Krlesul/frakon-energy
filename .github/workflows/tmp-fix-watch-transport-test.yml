name: Temporary Source Watch Transport Test Fix

on:
  push:
    branches:
      - agent/fix-commissioning-live-state

permissions:
  contents: write

jobs:
  fix-test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
        with:
          ref: agent/fix-commissioning-live-state
          fetch-depth: 0
      - uses: actions/setup-python@v5
        with:
          python-version: '3.13'
      - name: Update shared transport expectation
        run: |
          python - <<'PY'
          from pathlib import Path
          p = Path('tests/test_tariff_source_watch_fetch.py')
          text = p.read_text(encoding='utf-8')
          old = '''                "headers": request.headers_dict(),\n                "allow_redirects": False,\n                "timeout": 9.0,\n'''
          new = '''                "headers": request.headers_dict(),\n                "allow_redirects": False,\n                "timeout": 9.0,\n                "max_line_size": transport.TARIFF_HTTP_MAX_LINE_SIZE,\n                "max_field_size": transport.TARIFF_HTTP_MAX_FIELD_SIZE,\n'''
          if text.count(old) != 1:
              raise SystemExit(f'expected one source-watch request assertion, got {text.count(old)}')
          p.write_text(text.replace(old, new, 1), encoding='utf-8')
          PY
      - name: Run transport tests
        run: |
          python -m pip install -q pytest
          python -m pytest -q tests/test_tariff_http_transport.py tests/test_tariff_source_watch_fetch.py
      - name: Commit test fix
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add tests/test_tariff_source_watch_fetch.py
          git commit -m "Update source watch transport regression expectation"
          git push origin HEAD:agent/fix-commissioning-live-state
